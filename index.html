const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const today=()=>new Date().toLocaleDateString('en-CA');const makeDrill=(a)=>({id:uid(),name:a[0],min:a[1],notes:a[2],done:false});const initial=()=>({teams:[{id:'bruins',name:'Bruins',players:[]}],team:'bruins',plans:[{id:'first',team:'bruins',name:'Movement With Purpose',date:'2026-11-23',location:'Veterans Park',coach:'',focus:'Ball movement, off-ball movement, jump shooting; No-Middle, help and rotation',drills:seed.map(makeDrill),notes:'',attendance:{},ratings:{},teamEval:{},score:[0,0],index:0,timer:{remaining:180,end:null}}],active:'first',library:seed.filter(a=>a[0]!=='Hydration').map(makeDrill),history:[]});let s;try{s=JSON.parse(localStorage.getItem('dvh-os-v1'))||initial()}catch(e){s=initial()}let tab='Live',storageOK=true;const save=()=>{try{localStorage.setItem('dvh-os-v1',JSON.stringify(s))}catch(e){storageOK=false;document.getElementById('warning')?.remove();document.body.insertAdjacentHTML('afterbegin','<div id="warning" style="background:#ffe4b5;padding:12px">Local saving unavailable. Export a backup before closing.</div>')}};const p=()=>s.plans.find(x=>x.id===s.active);const team=()=>s.teams.find(x=>x.id===s.team);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(t,js,cl='')=>`<button class="${cl}" onclick="${js}">${t}</button>`;const field=(label,value,js,type='text')=>`<label>${label}</label><input class="wide" type="${type}" value="${esc(value)}" onchange="${js}">`;const area=(label,value,js)=>`<label>${label}</label><textarea onchange="${js}">${esc(value)}</textarea>`;const update=(k,v)=>{p()[k]=v;save()};const tabs=['Live','Planner','Library','Teams','Attendance','Evaluations','Team Eval','Scoreboard','History','Backup'];

function teamRate(area,v){let a=p();if(!a.teamEval||typeof a.teamEval!=='object')a.teamEval={};v=Number(v);if(v>0)a.teamEval[area]=v;else delete a.teamEval[area];save();render()}
function teamChart(rows){let n=rows.length,W=600,H=220,L=40,R=10,T=15,B=30;let X=i=>n===1?W/2:L+i*(W-L-R)/Math.max(1,n-1);let Y=v=>T+(1-v/5)*(H-T-B);let cols={Culture:'#2563eb','Team offense':'#0d9488','Team defense':'#7c3aed'};let lines=TEAM_SUBJECTS.map(s=>{let pts=rows.map((r,i)=>r.sc[s.name]?[X(i),Y(r.sc[s.name].avg)]:null).filter(Boolean);if(!pts.length)return '';let d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');let dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${cols[s.name]}"/>`).join('');return `<path d="${d}" fill="none" stroke="${cols[s.name]}" stroke-width="2"/>${dots}`}).join('');let labels=rows.map((r,i)=>`<text x="${X(i)}" y="${H-8}" font-size="10" fill="#64748b" text-anchor="middle">${r.label}</text>`).join('');let legend=TEAM_SUBJECTS.map(s=>`<span style="color:${cols[s.name]}">● ${esc(s.name)}</span>`).join(' &nbsp; ');return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Team development chart">${lines}${labels}</svg><p class="muted">${legend}</p>`}

function playerStats(id,sessions){let overalls=[],areaVals={};INDIV_AREAS.forEach(c=>areaVals[c]=[]);sessions.forEach(x=>{let r=x.ratings?x.ratings[id]:undefined;if(!r)return;let v=INDIV_AREAS.map(c=>r[c]).filter(n=>typeof n==='number'&&n>0);if(!v.length)return;overalls.push(v.reduce((a,b)=>a+b,0)/v.length);INDIV_AREAS.forEach(c=>{if(typeof r[c]==='number'&&r[c]>0)areaVals[c].push(r[c])})});if(!overalls.length)return null;let avg=a=>a.reduce((x,y)=>x+y,0)/a.length;let hist=avg(overalls),last3=avg(overalls.slice(-3)),prev3=overalls.length>3?avg(overalls.slice(-6,-3)):null;let d=prev3===null?null:last3-prev3;let trend=prev3===null?'—':(d>=0.10?'Improving ▲':(d<=-0.10?'Regression ▼':'Consistent —'));let areaAvg={};INDIV_AREAS.forEach(c=>areaAvg[c]=areaVals[c].length?avg(areaVals[c]):null);let weakest=null;INDIV_AREAS.forEach(c=>{if(areaAvg[c]!==null&&(weakest===null||areaAvg[c]<areaAvg[weakest]))weakest=c});return {hist,last3,prev3,trend,areaAvg,weakest,count:overalls.length}}
function playerHistoryHTML(){let sessions=playerSessions();let ids=[];sessions.forEach(x=>{Object.keys(x.ratings||{}).forEach(id=>{if(id==='team'||ids.includes(id))return;if(INDIV_AREAS.some(c=>typeof x.ratings[id]?.[c]==='number'&&x.ratings[id][c]>0))ids.push(id)})});let ordered=[];s.teams.forEach(t=>{t.players.forEach(pl=>{if(ids.includes(pl.id))ordered.push(pl.id)})});let rows=ordered.map(id=>{let st=playerStats(id,sessions);let who=playerNameById(id);return st&&who?{id,who,st}:null}).filter(Boolean);if(!rows.length)return `<div class="card"><h2>Player development over time</h2><p class="muted">No player ratings in saved history yet. Rate players in Evaluations, then save the session from Live — their averages will build here.</p></div>`;let avg2=v=>v===null?'—':v.toFixed(2);let card1=`<div class="card"><h2>Player development over time</h2><p class="muted">Averages use only rated areas — unrated areas never count as zero. The active practice's latest ratings are included. Trend compares the average of the 3 most recent rated practices with the preceding 3 — a change of 0.10 or more counts as improving or regression.</p><div style="overflow:auto"><table class="tbl"><tr><th>Player</th><th class="num">Overall avg</th><th class="num">Last 3 avg</th><th class="num">Previous 3 avg</th><th>Trend</th><th class="num">Practices rated</th><th>Weakest area</th></tr>${rows.map(r=>`<tr><td>${esc(r.who.name)} <span class="muted">${esc(r.who.team)}</span></td><td class="num">${r.st.hist.toFixed(2)}</td><td class="num">${r.st.last3.toFixed(2)}</td><td class="num">${avg2(r.st.prev3)}</td><td>${r.st.trend}</td><td class="num">${r.st.count}</td><td>${esc(r.st.weakest||'—')}</td></tr>`).join('')}</table></div></div>`;let card2=`<div class="card"><h2>Player averages by area</h2><div style="overflow:auto"><table class="tbl"><tr><th>Player</th>${INDIV_AREAS.map(c=>`<th class="num">${esc(c)}</th>`).join('')}<th class="num">Overall</th></tr>${rows.map(r=>`<tr><td>${esc(r.who.name)} <span class="muted">${esc(r.who.team)}</span></td>${INDIV_AREAS.map(c=>`<td class="num">${avg2(r.st.areaAvg[c])}</td>`).join('')}<td class="num">${r.st.hist.toFixed(2)}</td></tr>`).join('')}</table></div></div>`;return card1+card2}
function teamHistoryHTML(){let ev=s.history.filter(x=>x.teamEval&&Object.keys(x.teamEval).some(k=>typeof x.teamEval[k]==='number'&&x.teamEval[k]>0));if(!ev.length)return `<div class="card"><h2>Team development over time</h2><p class="muted">No team evaluations in saved history yet. Rate the team in Team Eval, then save the session from Live.</p></div>`;let avg=a=>a.reduce((x,y)=>x+y,0)/a.length;let row=(label,vals)=>{let n=vals.length;if(!n)return `<tr><td>${esc(label)}</td><td class="num">—</td><td class="num">—</td><td class="num">—</td><td>—</td><td class="num">0</td></tr>`;let hi=avg(vals),rc=avg(vals.slice(-3)),pr=vals.length>3?avg(vals.slice(-6,-3)):null,d=pr===null?null:rc-pr;let tr=pr===null?'—':(d>=0.10?'Improving ▲':(d<=-0.10?'Regression ▼':'Consistent —'));return `<tr><td>${esc(label)}</td><td class="num">${hi.toFixed(2)}</td><td class="num">${rc.toFixed(2)}</td><td class="num">${pr===null?'—':pr.toFixed(2)}</td><td>${tr}</td><td class="num">${n}</td></tr>`};let rows='';TEAM_SUBJECTS.forEach(subj=>{rows+=`<tr><td colspan="6"><b>${esc(subj.name)}</b></td></tr>`;subj.areas.forEach(ar=>{rows+=row(ar.n,ev.map(x=>te(x)[ar.n]).filter(n=>typeof n==='number'&&n>0))});rows+=row(subj.name+' average',ev.map(x=>{let v=subjAvg(x,subj);return v?v.avg:null}).filter(n=>n!==null))});rows+=`<tr><td colspan="6"><b>Overall</b></td></tr>`+row('Overall practice rating',ev.map(x=>teamOverall(x)).filter(n=>n!==null));let trend=ev.map((x,i)=>{let sc=teamScores(x);return {label:'P'+(i+1),date:x.date,team:x.teamName||'',sc,ov:teamOverall(x)}});return `<div class="card"><h2>Team development over time</h2><p class="muted">${ev.length} evaluated practice${ev.length>1?'s':''} in history. Trend compares the average of the 3 most recent evaluations with the preceding 3 — a change of 0.10 or more counts as improving or regression.</p>${teamChart(trend)}<div style="overflow:auto"><table class="tbl"><tr><th>Practice</th><th>Date</th><th class="num">Culture</th><th class="num">Offense</th><th class="num">Defense</th><th class="num">Overall</th></tr>${trend.map(r=>`<tr><td>${r.label}</td><td>${esc(r.date||'')}</td><td class="num">${r.sc['Culture']?r.sc['Culture'].avg.toFixed(2):'—'}</td><td class="num">${r.sc['Team offense']?r.sc['Team offense'].avg.toFixed(2):'—'}</td><td class="num">${r.sc['Team defense']?r.sc['Team defense'].avg.toFixed(2):'—'}</td><td class="num">${r.ov!==null?r.ov.toFixed(2):'—'}</td></tr>`).join('')}</table></div></div><div class="card"><h2>Historical team averages</h2><div style="overflow:auto"><table class="tbl"><tr><th>Area</th><th class="num">Historical avg</th><th class="num">Last 3 avg</th><th class="num">Previous 3 avg</th><th>Trend</th><th class="num">Evaluations</th></tr>${rows}</table></div></div>`}function go(t){tab=t;render()}function render(){document.getElementById('nav').innerHTML=tabs.map(t=>btn(t,`go('${t}')`,tab===t?'active':'')).join('');let a=p(),h='';const head=`<div class="card"><div class="row"><div class="grow"><span class="muted">ACTIVE TEAM / PRACTICE</span><h2>${esc(team().name)}</h2></div><select onchange="switchTeam(this.value)">${s.teams.map(t=>`<option value="${t.id}" ${t.id===s.team?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><select class="wide" onchange="switchPlan(this.value)">${s.plans.filter(x=>x.team===s.team).map(x=>`<option value="${x.id}" ${x.id===s.active?'selected':''}>${esc(x.date+' · '+x.name)}</option>`).join('')}</select></div>`;
if(tab==='Live'){let d=a.drills[a.index],total=a.drills.reduce((n,x)=>n+x.min,0),done=a.drills.filter(x=>x.done).reduce((n,x)=>n+x.min,0);h=head+`<div class="card"><span class="muted">CURRENT DRILL</span><h2>${esc(d?.name||'Practice complete')}</h2><div id="clock" class="clock">00:00</div><div class="row">${btn('Start / Resume','start()','gold')}${btn('Pause','pause()')}${btn('+1 min','extend()','alt')}${btn('Reset','resetTimer()','alt')}${btn('Complete & next','next(true)')}${btn('Skip','next(false)','alt')}</div><p>${esc(d?.notes||'Review and save your session.')}</p><progress max="${total||1}" value="${done}"></progress><p class="muted">${done} / ${total} planned minutes completed</p></div><div class="card"><h2>Practice sequence</h2>${a.drills.map((x,i)=>`<div class="drill ${x.done?'done':''} ${i===a.index?'current':''}"><div class="row"><input type="checkbox" ${x.done?'checked':''} onchange="mark(${i},this.checked)"><div class="grow"><b>${esc(x.name)}</b><div class="muted">${x.min} min</div></div>${btn('Open',`jump(${i})`,'alt')}</div></div>`).join('')}${area('Live coaching notes',a.notes,"update('notes',this.value)")}${btn('Save session to history','archive()','gold')}</div>`}

if(tab==='Teams'){h=head+`<div class="card"><h2>Team roster</h2><div class="row"><input id="teamName" placeholder="New team name" class="grow">${btn('Add team','addTeam()')}</div><div class="row" style="margin-top:12px"><input id="playerName" placeholder="Player name or initials" class="grow">${btn('Add player','addPlayer()','gold')}</div>${team().players.map(x=>`<div class="drill row"><span class="grow">${esc(x.name)}</span>${btn('Remove',`removePlayer('${x.id}')`,'alt')}</div>`).join('')}<p class="muted">Use initials if preferred. No roster data is transmitted.</p></div>`}
if(tab==='Attendance'){h=head+`<div class="card"><h2>Attendance</h2>${team().players.length?team().players.map(x=>`<div class="drill row"><b class="grow">${esc(x.name)}</b><select onchange="att('${x.id}',this.value)">${['Unmarked','Present','Late','Absent','Excused'].map(v=>`<option ${v===(a.attendance[x.id]||'Unmarked')?'selected':''}>${v}</option>`).join('')}</select></div>`).join(''):'Add players in Teams first.'}</div>`}
if(tab==='Evaluations'){h=head+`<div class="card"><h2>Player evaluations</h2><p class="muted">1 Needs instruction · 2 Developing · 3 Inconsistent · 4 Proficient · 5 Game-ready</p>${[{id:'team',name:'Team overall'},...team().players].map(x=>`<details class="drill"><summary>${esc(x.name)} <span class="muted" id="pa-${x.id}">${practiceAvgText(a,x.id)}</span></summary>${INDIV_AREAS.map(c=>`<div class="row" style="margin:6px 0"><span class="grow">${c}</span><select onchange="rate('${x.id}','${c}',this.value)">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${n===(a.ratings[x.id]?.[c]||0)?'selected':''}>${n||'—'}</option>`).join('')}</select></div>`).join('')}${area('Development notes',a.ratings[x.id]?.notes||'',`rate('${x.id}','notes',this.value)`)}</details>`).join('')}</div>`}
if(tab==='Team Eval'){let sc=teamScores(a),complete=teamComplete(a),ov=complete?teamOverall(a):null;let rated=TEAM_AREAS.filter(n=>typeof te(a)[n]==='number'&&te(a)[n]>0).length;let subjBoxes=TEAM_SUBJECTS.map(s=>{let v=sc[s.name];return `<div class="stat"><span class="muted">${esc(s.name)}</span><b>${v?v.avg.toFixed(2)+' / 5':'—'}</b><div class="muted">${v?v.rated+' of '+v.total+' rated':'0 of '+s.areas.length+' rated'}</div></div>`}).join('');let report;if(complete){let arr=TEAM_SUBJECTS.map(s=>({name:s.name,avg:sc[s.name].avg}));arr.sort((x,y)=>y.avg-x.avg);report=arr[0].avg===arr[arr.length-1].avg?'<p><b>All three subjects are even.</b></p>':`<p><b>${esc(arr[0].name)} is the strongest area.</b> ${esc(arr[arr.length-1].name)} requires the most attention.</p>`}else report=`<p class="muted">Rate all 14 areas to complete the report — ${rated} of 14 rated so far. Subject averages use only rated areas; missing ratings do not count as zero.</p>`;h=head+`<div class="card"><h2>Team evaluation</h2><div class="grid"><div class="stat"><b>14</b>Team rating areas</div><div class="stat"><b>10</b>Individual rating areas</div><div class="stat"><b>3</b>Team evaluation subjects</div><div class="stat"><b>1</b>Overall practice rating</div></div><p class="muted">1 Needs instruction · 2 Developing · 3 Inconsistent · 4 Proficient · 5 Game-ready — 5 is always strong performance.</p></div>`+`<div class="card"><h2>Practice Performance Report</h2><p class="muted">DVH COACHING OS · ${esc(team().name)} · ${esc(a.date+' · '+a.name)}</p><div class="scorebox" style="margin-bottom:12px"><span class="muted" style="color:#e2c98c">OVERALL PRACTICE RATING</span><div class="score">${ov!==null?ov.toFixed(2)+' / 5.00':'—'}</div></div><div class="grid">${subjBoxes}</div>${report}</div>`+TEAM_SUBJECTS.map(s=>`<div class="card"><h2>${esc(s.name)}</h2>${s.areas.map(ar=>{let v=te(a)[ar.n]||0;return `<div class="drill"><div class="row" style="margin:6px 0"><div class="grow"><b>${esc(ar.n)}</b><div class="muted">${esc(ar.d)}</div>${ar.rev?`<div class="muted">${esc(ar.rev)}</div>`:''}</div><select onchange="teamRate('${ar.n}',this.value)">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${n===v?'selected':''}>${n||'—'}</option>`).join('')}</select></div></div>`}).join('')}</div>`).join('')}
if(tab==='Scoreboard'){h=head+`<div class="grid">${['NAVY','GOLD'].map((n,i)=>`<div class="scorebox"><b>${n}</b><div class="score">${a.score[i]}</div>${[1,2,3,-1].map(v=>btn(v>0?'+'+v:v,`score(${i},${v})`,'alt')).join('')}</div>`).join('')}</div><div class="card" style="margin-top:12px">${btn('Reset score','resetScore()','alt')}<p class="muted">Use +1 for stops, rotations or free throws; +2/+3 for baskets.</p></div>`}
if(tab==='History'){h=`<div class="card"><h2>Practice history</h2>${s.history.length?s.history.slice().reverse().map(x=>`<details class="drill"><summary>${esc(x.date+' · '+x.teamName+' · '+x.name)}</summary><p>${esc(x.notes)}</p><p>Score: ${x.score.join(' – ')}</p><p>${x.drills.filter(d=>d.done).length}/${x.drills.length} drills completed</p><pre style="white-space:pre-wrap">${esc(JSON.stringify({attendance:x.attendance,evaluations:x.ratings},null,2))}</pre>${btn('Duplicate as new practice',`fromHistory('${x.archiveId}')`,'alt')}</details>`).join(''):'No saved sessions yet. Save a session from Live.'}</div>`+teamHistoryHTML()+playerHistoryHTML()}
if(tab==='Backup'){h=`<div class="card"><h2>Local storage & backup</h2><p>Records save in this browser on this device. Private browsing, clearing browser data or moving the file can affect access. Export regularly. No cloud sync or user accounts.</p>${btn('Export JSON backup','exportData()','gold')}<label>Restore backup (replaces current records)</label><input type="file" accept=".json,application/json" onchange="restore(this)"><p>${btn('Print current view','window.print()','alt')}</p></div>`}document.getElementById('main').innerHTML=h;tick()}
function tick(){let el=document.getElementById('clock');if(!el)return;let t=p().timer,r=t.end?Math.max(0,Math.ceil((t.end-Date.now())/1000)):t.remaining;if(t.end&&r===0){t.end=null;t.remaining=0;save()}el.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0')}
function start(){let t=p().timer;if(!t.end&&t.remaining>0){t.end=Date.now()+t.remaining*1000;save();tick()}}function pause(){let t=p().timer;if(t.end){t.remaining=Math.max(0,Math.ceil((t.end-Date.now())/1000));t.end=null;save();tick()}}function extend(){let t=p().timer;if(t.end)t.end+=60000;else t.remaining+=60;save();tick()}function resetTimer(){p().timer={remaining:(p().drills[p().index]?.min||0)*60,end:null};save();tick()}function jump(i){p().index=i;resetTimer();save();render()}function next(done){let a=p();if(a.drills[a.index]&&done)a.drills[a.index].done=true;jump(Math.min(a.index+1,a.drills.length))}function mark(i,v){p().drills[i].done=v;save();render()}
function blank(t){return {id:uid(),team:t,name:'New practice',date:new Date().toISOString().slice(0,10),location:'',coach:'',focus:'',drills:[],notes:'',attendance:{},ratings:{},teamEval:{},score:[0,0],index:0,timer:{remaining:0,end:null}}}function newPlan(){let a=blank(s.team);s.plans.push(a);s.active=a.id;save();render()}function switchTeam(id){s.team=id;let a=s.plans.find(x=>x.team===id);if(!a){a=blank(id);s.plans.push(a)}s.active=a.id;save();render()}function switchPlan(id){s.active=id;save();render()}function clonePlan(x){let a=JSON.parse(JSON.stringify(x));Object.assign(a,{id:uid(),date:new Date().toISOString().slice(0,10),notes:'',attendance:{},ratings:{},score:[0,0],index:0});a.teamEval={};a.drills.forEach(d=>d.done=false);a.timer={remaining:(a.drills[0]?.min||0)*60,end:null};s.plans.push(a);s.team=a.team;s.active=a.id;save();go('Planner')}function duplicate(){clonePlan(p())}function editDrill(i,k,v){p().drills[i][k]=k==='min'?Math.max(0,Math.round(Number(v)||0)):v;if(k==='min'){resetTimer();save();render()}else save()}function move(i,n){let d=p().drills,j=i+n;if(j<0||j>=d.length)return;[d[i],d[j]]=[d[j],d[i]];jump(0)}function removeDrill(i){p().drills.splice(i,1);jump(0)}function addDrill(){p().drills.push(makeDrill(['New drill',5,'']));if(p().drills.length===1)resetTimer();save();render()}function newLibrary(){s.library.push(makeDrill(['New drill',5,'']));save();render()}function libEdit(i,k,v){s.library[i][k]=k==='min'?Math.max(0,Math.round(Number(v)||0)):v;save()}function useLib(i){let d=s.library[i];p().drills.push(makeDrill([d.name,d.min,d.notes]));if(p().drills.length===1)resetTimer();save();go('Planner')}function delLib(i){if(confirm('Delete library drill?')){s.library.splice(i,1);save();render()}}function addTeam(){let n=document.getElementById('teamName').value.trim();if(n){let id=uid();s.teams.push({id,name:n,players:[]});switchTeam(id)}}function addPlayer(){let n=document.getElementById('playerName').value.trim();if(n){team().players.push({id:uid(),name:n});save();render()}}function removePlayer(id){if(confirm('Remove player from roster? Saved history remains.')){team().players=team().players.filter(x=>x.id!==id);save();render()}}function att(id,v){p().attendance[id]=v;save()}function rate(id,c,v){p().ratings[id]??={};p().ratings[id][c]=c==='notes'?v:Number(v);save();let el=document.getElementById('pa-'+id);if(el)el.textContent=practiceAvgText(p(),id)}function score(i,v){p().score[i]=Math.max(0,p().score[i]+v);save();render()}function resetScore(){p().score=[0,0];save();render()}function archive(){pause();let a=JSON.parse(JSON.stringify(p()));a.archiveId=uid();a.teamName=team().name;a.savedAt=new Date().toISOString();s.history.push(a);save();go('History')}function fromHistory(id){clonePlan(s.history.find(x=>x.archiveId===id))}function exportData(){let u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='DVH-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.teams)||!Array.isArray(x.plans)||!Array.isArray(x.library)||!Array.isArray(x.history)||!x.teams.some(t=>t.id===x.team)||!x.plans.some(p=>p.id===x.active))throw Error();if(confirm('Replace all local records with this backup?')){s=x;s.plans.forEach(pl=>{if(!pl.teamEval||typeof pl.teamEval!=='object')pl.teamEval={}});s.history.forEach(pl=>{if(!pl.teamEval||typeof pl.teamEval!=='object')pl.teamEval={}});save();go('Live')}}catch(e){alert('Invalid DVH backup.')}}save();render();setInterval(tick,250);
</script><script>
const statusEl=document.getElementById('offlineStatus');
function statusUpdate(){statusEl.textContent=(navigator.onLine?'Online':'Offline')+' · '+(navigator.serviceWorker?.controller?'Offline cache active':'Offline setup pending')+' · Records stored on this device';}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(statusUpdate).catch(()=>{statusEl.textContent='Offline setup failed. Open the hosted HTTPS site and reload.'});navigator.serviceWorker.addEventListener('controllerchange',statusUpdate);window.addEventListener('online',statusUpdate);window.addEventListener('offline',statusUpdate);}else{statusEl.textContent='Offline installation requires a supported browser and HTTPS.';}
</script></body></html>
