*{box-sizing:border-box}body{margin:0;background:#f1f3f6;color:#14283f;font:16px system-ui,sans-serif}header{background:#10243e;color:white;padding:22px 18px;border-bottom:4px solid #b99a58}header small{color:#e2c98c;letter-spacing:2px}h1{margin:5px 0;font-size:28px}h2{margin:0 0 14px}nav{display:flex;overflow:auto;gap:6px;background:#10243e;padding:8px;position:sticky;top:0;z-index:3}button,input,select,textarea{font:inherit;border-radius:8px;padding:11px;border:1px solid #c8d0db}button{background:#142d4d;color:white;cursor:pointer;min-height:44px}button.gold{background:#c3a565;color:#10243e;font-weight:bold}button.alt{background:white;color:#142d4d}button.danger{background:#8b3440}nav button{white-space:nowrap;border:0}nav button.active{background:#c3a565;color:#10243e}main{max-width:1000px;margin:auto;padding:16px}.card{background:white;border:1px solid #dce1e8;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #14283f09}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}input,textarea,select{background:white;color:#14283f;max-width:100%}textarea{width:100%;min-height:75px}label{display:block;font-size:13px;font-weight:700;margin:8px 0 4px}.muted{color:#64748b;font-size:13px}.clock{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}.clock.alarming{animation:alarmFlash 1s infinite}@keyframes alarmFlash{0%,100%{background:#8b3440;color:#fff}50%{background:transparent;color:#8b3440}}#alarmOverlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:#8b3440;color:#fff;text-align:center;padding:24px;animation:alarmFlashBg 1s infinite}#alarmOverlay h2{font-size:44px;margin:0;letter-spacing:1px}#alarmOverlay p{font-size:20px;margin:0}#alarmOverlay button{font-size:22px;padding:16px 28px;min-height:56px}@keyframes alarmFlashBg{0%,100%{background:#8b3440}50%{background:#5c1f27}}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat{background:#edf1f6;padding:14px;border-radius:10px}.stat b{display:block;font-size:26px}.drill{border-top:1px solid #e0e5eb;padding:12px 0}.done{opacity:.55}.current{border-left:4px solid #b99a58;padding-left:10px}progress{width:100%;accent-color:#b99a58;height:12px}.score{font-size:54px;font-weight:bold}.scorebox{text-align:center;background:#142d4d;color:white;border-radius:12px;padding:15px}.scorebox:nth-child(2){background:#a58a50;color:#fff}.scorebox button{margin:3px}.wide{width:100%}footer{padding:20px;text-align:center;color:#64748b;font-size:12px}details summary{cursor:pointer;font-weight:700;padding:8px 0}@media(max-width:500px){main{padding:10px}.clock{font-size:52px}.card{padding:12px}}@media print{nav,button,footer{display:none}body{background:white}.card{break-inside:avoid}}
body{padding-bottom:env(safe-area-inset-bottom)}header{padding-top:calc(22px + env(safe-area-inset-top))}nav{scrollbar-width:none}input,select,textarea{font-size:16px}button{touch-action:manipulation}pre{overflow-wrap:anywhere}#offlineStatus{font-size:12px;padding:8px 16px;background:#e6ebf1} @media(max-width:500px){.row button{flex-grow:1}.scorebox{padding:8px}}.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{border-bottom:1px solid #e0e5eb;padding:6px 4px;text-align:left;vertical-align:top}.tbl td.num,.tbl th.num{text-align:right}button.sm{min-height:36px;padding:6px 10px}.statctl{display:inline-flex;align-items:center;gap:4px;margin:2px 6px 2px 0}.statctl b{min-width:20px;text-align:center}.foulout{color:#8b3440;font-weight:800}.gstatgrid{display:flex;flex-wrap:wrap;gap:2px} </style></head><body><header><small>DIAMOND VALLEY HOOPS</small><h1>COACHING OS V1.7</h1><div>HARD WORK BEFORE GLORY</div></header><div id="offlineStatus" role="status">Preparing offline access…</div><nav id="nav"></nav><main id="main"></main><footer>DVH Coaching OS V1.7 · PWA edition · Export backups regularly</footer><div id="alarmOverlay" role="alert"><h2>TIME'S UP</h2><p id="alarmDrill"></p><p id="alarmStatus" style="display:none"></p><button class="gold" onclick="alarmStop()">Stop alarm</button><button id="alarmPause" onclick="pauseAuto()" style="display:none">Pause</button><button id="alarmResume" class="gold" onclick="resumeAuto()" style="display:none">Resume</button></div><script>
const seed=[['Opening huddle',3,'Movement with purpose. Communicate, move after passing, finish possessions.'],['Athletic preparation',10,'Dynamic mobility, slides, acceleration and controlled deceleration.'],['Ball handling',8,'Cross Cross; Cross Tween; Between Behind; Tween Cross Tween; Double Snap; Between Cross; Double Cross Between Behind; Punch Between; Speed Stop Snap; Speed Stop Tween. Control → speed → guided pressure.'],['Hydration',2,'Water available throughout.'],['Transition finishing',12,'4 min both hands; 4 min 2-on-1; 4 min 3-on-2. Target 7 quality chances in 10 possessions.'],['Game-speed shooting',12,'3 min each: form, catch-and-shoot, relocate, cuts and closeouts. Record makes/attempts.'],['Hydration',2,'Water.'],['DAWG House defense',23,'4 min zig-zag; 4 wall-up; 4 closeouts; 4 gap defense; 5 shell; 2 rebound. No middle, help, rotate, recover.'],['Hydration',2,'Water.'],['Offensive implementation',20,'7 min Twist into Miami: DHO, re-screen, roller middle, corner attack, baseline screen, slot cut. 6 min V Cut Miami: corner pass, V-screen, wing above, slot cut; counter wing three. 7 min BLOB Box, Stack, Memphis.'],['Hydration',2,'Water.'],['Competitive live play',18,'6 min pass-cut-screen-relocate; 6 min defensive bonus points; 6 min normal game.'],['Pressure free throws',4,'Consistent routine; record makes/attempts.'],['Cooldown and accountability',2,'Light cooldown, player creativity, next practice priority.']];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const today=()=>new Date().toLocaleDateString('en-CA');const makeDrill=(a)=>({id:uid(),name:a[0],min:a[1],notes:a[2],done:false});const initial=()=>({teams:[{id:'bruins',name:'Bruins',players:[]}],team:'bruins',plans:[{id:'first',team:'bruins',name:'Movement With Purpose',date:'2026-11-23',location:'Veterans Park',coach:'',focus:'Ball movement, off-ball movement, jump shooting; No-Middle, help and rotation',drills:seed.map(makeDrill),notes:'',attendance:{},ratings:{},teamEval:{},score:[0,0],index:0,timer:{remaining:180,end:null}}],active:'first',library:seed.filter(a=>a[0]!=='Hydration').map(makeDrill),history:[],games:[],activeGame:null});let s;try{s=JSON.parse(localStorage.getItem('dvh-os-v1'))||initial()}catch(e){s=initial()}normGames();let tab='Live',storageOK=true;const save=()=>{try{localStorage.setItem('dvh-os-v1',JSON.stringify(s))}catch(e){storageOK=false;document.getElementById('warning')?.remove();document.body.insertAdjacentHTML('afterbegin','<div id="warning" style="background:#ffe4b5;padding:12px">Local saving unavailable. Export a backup before closing.</div>')}};const GAME_STATS=[['pts','PTS'],['reb','REB'],['ast','AST'],['stl','STL'],['blk','BLK'],['tov','TOV'],['pf','PF']];
const blankGameStats=()=>({pts:0,reb:0,ast:0,stl:0,blk:0,tov:0,pf:0});
const GAME_PERIOD_SECS=480;
function normGames(){try{if(!Array.isArray(s.games))s.games=[];if(!('activeGame' in s))s.activeGame=null;s.games.forEach(g=>{if(!g.stats||typeof g.stats!=='object')g.stats={};if(!g.clock||typeof g.clock!=='object')g.clock={remaining:GAME_PERIOD_SECS,end:null};if(typeof g.oppScore!=='number')g.oppScore=0;if(typeof g.period!=='number'||g.period<1||g.period>4)g.period=1;if(g.status!=='final')g.status='live';if(typeof g.notes!=='string')g.notes='';})}catch(e){}}
const game=()=>s.games.find(x=>x.id===s.activeGame&&x.teamId===s.team)||null;
const dvhTotal=g=>Object.values(g.stats||{}).reduce((t,r)=>t+(r.pts||0),0);
const gameWL=g=>{let d=dvhTotal(g),o=g.oppScore||0;return d>o?'W':d<o?'L':'T'};
const fmtClock=r=>String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
function newGame(){let d=document.getElementById('gDate');let o=document.getElementById('gOpponent');let date=d&&d.value?d.value:today();let opp=o&&o.value.trim()?o.value.trim():'';let t=team();let g={id:uid(),teamId:t.id,date,opponent:opp,period:1,clock:{remaining:GAME_PERIOD_SECS,end:null},oppScore:0,status:'live',notes:'',stats:{}};t.players.forEach(pl=>{g.stats[pl.id]=blankGameStats()});s.games.push(g);s.activeGame=g.id;save();render()}
function openGame(id){s.activeGame=id||null;save();render()}
function gstat(gid,pid,k,d){let g=s.games.find(x=>x.id===gid);if(!g||g.status==='final')return;g.stats[pid]??=blankGameStats();let r=g.stats[pid];r[k]=Math.max(0,(r[k]||0)+d);save();let el=document.getElementById('gs-'+gid+'-'+pid+'-'+k);if(el){el.textContent=r[k];if(k==='pf'){if(r[k]>=5)el.classList.add('foulout');else el.classList.remove('foulout')}}if(k==='pts'){let sc=document.getElementById('gscore');if(sc)sc.textContent=dvhTotal(g)}}
function gopp(gid,d){let g=s.games.find(x=>x.id===gid);if(!g||g.status==='final')return;g.oppScore=Math.max(0,(g.oppScore||0)+d);save();let el=document.getElementById('oppscore');if(el)el.textContent=g.oppScore}
function gclockStart(){let g=game();if(!g||g.status==='final')return;let c=g.clock;if(!c.end&&c.remaining>0){c.end=Date.now()+c.remaining*1000;save();gameTick()}}
function gclockPause(){let g=game();if(!g)return;let c=g.clock;if(c.end){c.remaining=Math.max(0,Math.ceil((c.end-Date.now())/1000));c.end=null;save();gameTick()}}
function gclockReset(){let g=game();if(!g)return;g.clock={remaining:GAME_PERIOD_SECS,end:null};save();gameTick()}
function gnextPeriod(){let g=game();if(!g||g.status==='final')return;if(g.period>=4)return;g.period++;g.clock={remaining:GAME_PERIOD_SECS,end:null};save();render()}
function gameTick(){let g=game();let el=document.getElementById('gclock');if(!el||!g)return;let c=g.clock,r=c.end?Math.max(0,Math.ceil((c.end-Date.now())/1000)):c.remaining;if(c.end&&r===0){c.end=null;c.remaining=0;save()}el.textContent=fmtClock(r)}
function finalGame(){let g=game();if(!g)return;g.clock.end=null;g.status='final';save();render()}
function reopenGame(){let g=game();if(!g)return;g.status='live';save();render()}
function gnotes(v){let g=game();if(!g)return;g.notes=v;save()}
function gamesHTML(){
let t=team();
let list=s.games.filter(g=>g.teamId===s.team).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
let g=game();
let out=`<div class="card"><h2>Games — ${esc(t.name)}</h2><p class="muted">Advanced scorekeeping: full stat line per player, live game clock, season totals. Games save on this device; export a backup regularly.</p><div class="row"><label style="display:flex;flex-direction:column;gap:4px">Date<input id="gDate" type="date" value="${today()}"></label><label style="display:flex;flex-direction:column;gap:4px">Opponent<input id="gOpponent" placeholder="Opponent name"></label>${btn('New game','newGame()','gold')}</div>${list.length?`<label>Open game</label><select class="wide" onchange="openGame(this.value)"><option value="">— select a game —</option>${list.map(x=>`<option value="${x.id}" ${g&&x.id===g.id?'selected':''}>${esc(x.date+' · vs '+(x.opponent||'Unnamed')+' · '+dvhTotal(x)+' - '+(x.oppScore||0)+(x.status==='final'?' · Final':' · Live'))}</option>`).join('')}</select>`:''}</div>`;
if(g)out+=gameCardHTML(g);
out+=seasonTotalsHTML();
out+=`<div class="card"><h2>Games list</h2>${list.length?list.map(x=>`<div class="drill row"><div class="grow"><b>${esc(x.date||'')}</b> · vs ${esc(x.opponent||'Unnamed')} <span class="muted">${x.status==='final'?'Final':'Live'} · ${gameWL(x)}</span><div class="muted">${esc(t.name)} ${dvhTotal(x)} - ${x.oppScore||0} ${esc(x.opponent||'')}</div></div>${btn('Open',`openGame('${x.id}')`,'alt')}</div>`).join(''):'<p class="muted">No games yet for this team. Create one above.</p>'}</div>`;
return out}
function gameCardHTML(g){
let t=s.teams.find(x=>x.id===g.teamId);
let players=t?t.players:[];
if(g.status!=='final'){let ch=false;players.forEach(pl=>{if(!g.stats[pl.id]){g.stats[pl.id]=blankGameStats();ch=true}});if(ch)save();}
let dv=dvhTotal(g),op=g.oppScore||0;
let h=`<div class="card"><div class="row"><div class="grow"><span class="muted">${esc(g.date||'')} · Q${g.period} · ${g.status==='final'?'Final':'Live'}</span><h2>${esc(t?t.name:'')} vs ${esc(g.opponent||'Unnamed')}</h2></div></div><div class="grid"><div class="scorebox"><b>${esc(t?t.name:'')}</b><div class="score" id="gscore">${dv}</div></div><div class="scorebox"><b>${esc(g.opponent||'OPP')}</b><div class="score" id="oppscore">${op}</div></div></div><div class="row" style="margin-top:12px"><span class="muted">Game clock · Q${g.period}</span><div class="clock" id="gclock" style="font-size:44px">--:--</div></div>`;
if(g.status!=='final'){
h+=`<div class="row">${btn('Start clock','gclockStart()','gold')}${btn('Pause clock','gclockPause()')}${btn('Reset clock','gclockReset()','alt')}${g.period<4?btn('Next period','gnextPeriod()','alt'):''}</div><div class="row" style="margin-top:8px"><span class="muted">Opponent score</span>${[1,2,3,-1].map(v=>btn(v>0?'+'+v:v,`gopp('${g.id}',${v})`,'alt')).join('')}</div></div>`;
h+=`<div class="card"><h2>Player stats</h2><p class="muted">Tap + / - on the sideline. Points also have quick +1 / +2 / +3. Team score is the sum of player points. 5 fouls highlights red.</p>${players.length?players.map(pl=>{let r=g.stats[pl.id]||blankGameStats();return `<div class="drill"><div class="row"><b class="grow">${esc(pl.name)}</b><span class="muted">${r.pts||0} pts</span></div><div class="gstatgrid">${GAME_STATS.map(([k,l])=>{let v=r[k]||0;return `<span class="statctl"><span class="muted">${l}</span><b id="gs-${g.id}-${pl.id}-${k}"${k==='pf'&&v>=5?' class="foulout"':''}>${v}</b><button class="sm alt" onclick="gstat('${g.id}','${pl.id}','${k}',-1)">-</button><button class="sm alt" onclick="gstat('${g.id}','${pl.id}','${k}',1)">+</button></span>`}).join('')}</div><div class="row" style="margin-top:4px"><span class="muted">Quick points</span>${btn('+1 FT',`gstat('${g.id}','${pl.id}','pts',1)`,'alt')}${btn('+2',`gstat('${g.id}','${pl.id}','pts',2)`,'alt')}${btn('+3',`gstat('${g.id}','${pl.id}','pts',3)`,'alt')}</div></div>`}).join(''):'<p class="muted">Add players in Teams first.</p>'}</div>`;
h+=`<div class="card">${area('Game notes',g.notes,"gnotes(this.value)")}${btn('Finalize game','finalGame()','gold')}</div>`;
}else{
h+=`</div>`;
h+=boxScoreHTML(g);
h+=`<div class="card">${g.notes?`<p>${esc(g.notes)}</p>`:'<p class="muted">No game notes.</p>'}${btn('Edit game (reopen)','reopenGame()','alt')}</div>`;
}
return h}
function boxScoreHTML(g){
let t=s.teams.find(x=>x.id===g.teamId);
let players=t?t.players:[];
let rows=players.filter(pl=>g.stats[pl.id]).map(pl=>({pl,r:g.stats[pl.id]}));
let tot=blankGameStats();
rows.forEach(({r})=>GAME_STATS.forEach(([k])=>{tot[k]+=r[k]||0}));
return `<div class="card"><h2>Box score — Final</h2><div style="overflow:auto"><table class="tbl"><tr><th>Player</th>${GAME_STATS.map(([,l])=>`<th class="num">${l}</th>`).join('')}</tr>${rows.map(({pl,r})=>`<tr><td>${esc(pl.name)}</td>${GAME_STATS.map(([k])=>`<td class="num">${r[k]||0}</td>`).join('')}</tr>`).join('')}<tr><td><b>Team totals</b></td>${GAME_STATS.map(([k])=>`<td class="num"><b>${tot[k]}</b></td>`).join('')}</tr></table></div><p class="muted">Final: ${esc(t?t.name:'')} ${dvhTotal(g)} - ${g.oppScore||0} ${esc(g.opponent||'')} (${gameWL(g)})</p></div>`}
function seasonTotalsHTML(){
let t=team();
let fin=s.games.filter(g=>g.teamId===s.team&&g.status==='final');
if(!fin.length)return `<div class="card"><h2>Season totals</h2><p class="muted">No finalized games yet for ${esc(t.name)}. Finalize a game and its stats will total here.</p></div>`;
let tot={};
fin.forEach(g=>{Object.keys(g.stats||{}).forEach(pid=>{tot[pid]??={gp:0,...blankGameStats()};tot[pid].gp++;GAME_STATS.forEach(([k])=>{tot[pid][k]+=(g.stats[pid][k]||0)})})});
let rows=t.players.filter(pl=>tot[pl.id]).map(pl=>({pl,r:tot[pl.id]}));
if(!rows.length)return `<div class="card"><h2>Season totals</h2><p class="muted">No player stats in finalized games yet.</p></div>`;
let avg=(v,gp)=>gp?(v/gp).toFixed(1):'—';
let table=isAvg=>`<div style="overflow:auto"><table class="tbl"><tr><th>Player</th><th class="num">GP</th>${GAME_STATS.map(([,l])=>`<th class="num">${l}</th>`).join('')}</tr>${rows.map(({pl,r})=>`<tr><td>${esc(pl.name)}</td><td class="num">${r.gp}</td>${GAME_STATS.map(([k])=>`<td class="num">${isAvg?avg(r[k],r.gp):r[k]}</td>`).join('')}</tr>`).join('')}</table></div>`;
return `<div class="card"><h2>Season totals — ${esc(t.name)}</h2><p class="muted">${fin.length} finalized game${fin.length>1?'s':''}. Totals below, then per-game averages.</p>${table(false)}<h3 style="margin:12px 0 4px">Per-game averages</h3>${table(true)}</div>`}
const p=()=>s.plans.find(x=>x.id===s.active);const team=()=>s.teams.find(x=>x.id===s.team);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(t,js,cl='')=>`<button class="${cl}" onclick="${js}">${t}</button>`;const field=(label,value,js,type='text')=>`<label>${label}</label><input class="wide" type="${type}" value="${esc(value)}" onchange="${js}">`;const area=(label,value,js)=>`<label>${label}</label><textarea onchange="${js}">${esc(value)}</textarea>`;const update=(k,v)=>{p()[k]=v;save()};const tabs=['Live','Planner','Library','Teams','Attendance','Evaluations','Team Eval','Scoreboard','Games','History','Backup'];
const TEAM_SUBJECTS=[{name:'Culture',areas:[{n:'Picking each other up',d:'Supporting teammates after mistakes.'},{n:'Communication',d:'Positive and constructive communication.'},{n:'Team effort',d:'Collective hustle, discipline and accountability.'},{n:'Encouragement',d:'Celebrating teammates and reinforcing confidence.'}]},{name:'Team offense',areas:[{n:'Ball movement',d:'Purposeful passing, reversals and creating advantages.'},{n:'Layup execution',d:'Minimizing missed layups and finishing quality opportunities.',rev:'Rated in reverse: fewer missed layups earns a higher rating — 5 is always strong.'},{n:'Ball security',d:'Limiting unnecessary turnovers and making good decisions.',rev:'Rated in reverse: fewer turnovers earns a higher rating — 5 is always strong.'},{n:'Offensive communication',d:'Calling actions, screens, cuts and sets.'},{n:'Actions used',d:'Recognizing and executing installed offensive actions, such as Miami, Twist, V-Screen and MOB.'}]},{name:'Team defense',areas:[{n:'Defensive communication',d:'Calling screens, help, switches and rotations.'},{n:'Defensive stops',d:'Completing possessions with stops and securing rebounds.'},{n:'Defensive sprints',d:'Sprinting back in transition, recovering and closing out under control.'},{n:'Defensive rotations',d:'Helping early, covering teammates and recovering.'},{n:'Hand shading',d:"Correctly influencing the ball handler according to DVH's No-Middle defensive principles and dominant-hand scouting."}]}];
const TEAM_AREAS=TEAM_SUBJECTS.flatMap(s=>s.areas.map(a=>a.n));
const INDIV_AREAS=['Ball handling','Finishing','Shooting','Ball movement','Off-ball movement','Containment','Help and rotation','Rebounding','Communication','Effort and discipline'];
const playerNameById=id=>{for(const t of s.teams){let pl=t.players.find(x=>x.id===id);if(pl)return {name:pl.name,team:t.name}}return null};
const sessionOverall=(plan,id)=>{let v=INDIV_AREAS.map(c=>plan.ratings&&plan.ratings[id]?plan.ratings[id][c]:undefined).filter(n=>typeof n==='number'&&n>0);return v.length?{avg:v.reduce((x,y)=>x+y,0)/v.length,rated:v.length}:null};
const practiceAvgText=(plan,id)=>{let v=sessionOverall(plan,id);return v?`Practice average: ${v.avg.toFixed(2)} / 5 (${v.rated} of 10 rated)`:'—'};
const te=pl=>(pl.teamEval&&typeof pl.teamEval==='object')?pl.teamEval:{};
const subjAvg=(pl,subj)=>{let v=subj.areas.map(a=>te(pl)[a.n]).filter(n=>typeof n==='number'&&n>0);return v.length?{avg:v.reduce((x,y)=>x+y,0)/v.length,rated:v.length,total:subj.areas.length}:null};
const teamScores=pl=>{let o={};TEAM_SUBJECTS.forEach(s=>{o[s.name]=subjAvg(pl,s)});return o};
const teamComplete=pl=>TEAM_AREAS.every(n=>typeof te(pl)[n]==='number'&&te(pl)[n]>0);
const teamOverall=pl=>{if(!teamComplete(pl))return null;let sc=teamScores(pl);return TEAM_SUBJECTS.reduce((t,s)=>t+sc[s.name].avg,0)/TEAM_SUBJECTS.length};
function teamRate(area,v){let a=p();if(!a.teamEval||typeof a.teamEval!=='object')a.teamEval={};v=Number(v);if(v>0)a.teamEval[area]=v;else delete a.teamEval[area];save();render()}
function teamChart(rows){let n=rows.length,W=600,H=220,L=40,R=10,T=15,B=30;let X=i=>n===1?W/2:L+i*(W-L-R)/Math.max(1,n-1);let Y=v=>T+(1-v/5)*(H-T-B);let cols={Culture:'#2563eb','Team offense':'#0d9488','Team defense':'#7c3aed'};let lines=TEAM_SUBJECTS.map(s=>{let pts=rows.map((r,i)=>r.sc[s.name]?[X(i),Y(r.sc[s.name].avg)]:null).filter(Boolean);if(!pts.length)return '';let d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');let dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${cols[s.name]}"/>`).join('');return `<path d="${d}" fill="none" stroke="${cols[s.name]}" stroke-width="2"/>${dots}`}).join('');let labels=rows.map((r,i)=>`<text x="${X(i)}" y="${H-8}" font-size="10" fill="#64748b" text-anchor="middle">${r.label}</text>`).join('');let legend=TEAM_SUBJECTS.map(s=>`<span style="color:${cols[s.name]}">● ${esc(s.name)}</span>`).join(' &nbsp; ');return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Team development chart">${lines}${labels}</svg><p class="muted">${legend}</p>`}
function playerSessions(){let byId={};s.history.forEach(x=>{byId[x.id]=x});let a=p();if(a&&a.ratings&&Object.keys(a.ratings).some(id=>INDIV_AREAS.some(c=>typeof a.ratings[id]?.[c]==='number'&&a.ratings[id][c]>0)))byId[a.id]=a;let list=Object.values(byId);list.sort((x,y)=>String(x.date||'').localeCompare(String(y.date||'')));return list}
function playerStats(id,sessions){let overalls=[],areaVals={};INDIV_AREAS.forEach(c=>areaVals[c]=[]);sessions.forEach(x=>{let r=x.ratings?x.ratings[id]:undefined;if(!r)return;let v=INDIV_AREAS.map(c=>r[c]).filter(n=>typeof n==='number'&&n>0);if(!v.length)return;overalls.push(v.reduce((a,b)=>a+b,0)/v.length);INDIV_AREAS.forEach(c=>{if(typeof r[c]==='number'&&r[c]>0)areaVals[c].push(r[c])})});if(!overalls.length)return null;let avg=a=>a.reduce((x,y)=>x+y,0)/a.length;let hist=avg(overalls),last3=avg(overalls.slice(-3)),prev3=overalls.length>3?avg(overalls.slice(-6,-3)):null;let d=prev3===null?null:last3-prev3;let trend=prev3===null?'—':(d>=0.10?'Improving ▲':(d<=-0.10?'Regression ▼':'Consistent —'));let areaAvg={};INDIV_AREAS.forEach(c=>areaAvg[c]=areaVals[c].length?avg(areaVals[c]):null);let weakest=null;INDIV_AREAS.forEach(c=>{if(areaAvg[c]!==null&&(weakest===null||areaAvg[c]<areaAvg[weakest]))weakest=c});return {hist,last3,prev3,trend,areaAvg,weakest,count:overalls.length}}
const FOCUS={player:{"Ball handling":"10 extra minutes dribbling after practice — weak hand only, keep the dribble alive. Drill: Mason Elite two-ball series, weak hand only; lateral cone dribble.","Finishing":"50 layups after practice — rim-run, both sides, finish through contact. Drill: Layup Fast Break lines; drop-step series from both blocks.","Shooting":"100 shots before or after practice — form-first, hold the follow-through. Drill: Form shooting from the block, then spot-up jumpers from five spots.","Ball movement":"Drive. Kick. Swing. — extra pass before every shot in live finish; don't pick it up before you decide. Drill: 3-on-3 Drive. Kick. Swing. — drive, kick, swing, shoot.","Off-ball movement":"10 minutes of V-cuts and slot cuts after practice — cut with purpose, move without the ball. Drill: V-cut series into catch-and-go; slot cut to the rim.","Containment":"10 minutes walling up after practice — stay attached, chest square, shade the dominant hand, no middle. Drill: 1-on-1 wall-up — chest square, shade the dominant hand; no-middle closeout drill.","Help and rotation":"Help-and-recover reps — load up early from the gaps, stunt and recover, talk it. Drill: 4-on-4 shell — help early from the gaps, stunt and recover.","Rebounding":"Box-out block — hit first, pursue second, finish every possession. Drill: Closeout and box out — hit first, pursue second, secure the ball.","Communication":"Call it every rep — screen, help, switch, loud, every possession. Drill: Shell with talk — every defender calls screen, help, switch.","Effort and discipline":"DAWG House standard — effort every rep, discipline every possession. Drill: DAWG spell-out — defensive slides, sprint back and talk, closeout and box out, dive for the loose ball."},team:{"Picking each other up":"Next-play energy — pick each other up after every mistake, celebrate the extra pass. Drill: Next-play scrimmage — mistake, reset, next play; extra pass gets the praise.","Communication":"Team talk — every player calls what they see, every possession. Drill: 5-on-0 with calls — every cut, screen, and help called out loud.","Team effort":"Effort standard — sprint the floor both ways, every rep. Drill: Full-court sprint-back — first three steps on every change of possession.","Encouragement":"Bench and floor energy — build each other up, loud on every make. Drill: Live Finish with bench energy — bench calls out makes and extra passes.","Ball movement":"Drive. Kick. Swing. — extra pass, move it before you shoot it. Drill: 3-on-3 Drive. Kick. Swing. — drive, kick, swing, shoot.","Layup execution":"Layup Fast Break — finish at the rim, cut the missed layups. Drill: Layup Fast Break lines — rim-run, finish through contact, both sides.","Ball security":"Strong with the ball — don't pick it up early, value every possession. Drill: Pressure handling — 1-on-2 keep-away, strong with the ball, no live-ball turnovers.","Offensive communication":"Call the action — Miami, Twist, V-Screen, loud and early. Drill: 5-on-0 actions with calls — Miami, Twist, V-Screen, MOB, loud and early.","Actions used":"Run the actions — Miami, Twist, V-Screen, MOB, with pace. Drill: Actions circuit — rep Miami, Twist, V-Screen, MOB, each with pace.","Defensive communication":"Talk on defense — call the screen, call the help, call the switch. Drill: Shell with talk — call the screen, help, switch, every rep.","Defensive stops":"No middle — three stops is a kill, string kills together. Drill: Kill drill — three stops in a row, then string kills together.","Defensive sprints":"Sprint back on defense — first three steps, no jogging. Drill: Sprint-back drill — first three steps on every change of possession.","Defensive rotations":"Rotate on the catch — help early, recover together. Drill: 4-on-4 shell — rotate on the catch, help early, recover together.","Hand shading":"Shade the dominant hand — top foot high, force baseline. Drill: 1-on-1 shade drill — top foot high, force baseline, no middle."}};
function playerHistoryHTML(){let sessions=playerSessions();let ids=[];sessions.forEach(x=>{Object.keys(x.ratings||{}).forEach(id=>{if(id==='team'||ids.includes(id))return;if(INDIV_AREAS.some(c=>typeof x.ratings[id]?.[c]==='number'&&x.ratings[id][c]>0))ids.push(id)})});let ordered=[];s.teams.forEach(t=>{t.players.forEach(pl=>{if(ids.includes(pl.id))ordered.push(pl.id)})});let rows=ordered.map(id=>{let st=playerStats(id,sessions);let who=playerNameById(id);return st&&who?{id,who,st}:null}).filter(Boolean);if(!rows.length)return `<div class="card"><h2>Player development over time</h2><p class="muted">No player ratings in saved history yet. Rate players in Evaluations, then save the session from Live — their averages will build here.</p></div>`;let avg2=v=>v===null?'—':v.toFixed(2);let card1=`<div class="card"><h2>Player development over time</h2><p class="muted">Averages use only rated areas — unrated areas never count as zero. The active practice's latest ratings are included. Trend compares the average of the 3 most recent rated practices with the preceding 3 — a change of 0.10 or more counts as improving or regression.</p><div style="overflow:auto"><table class="tbl"><tr><th>Player</th><th class="num">Overall avg</th><th class="num">Last 3 avg</th><th class="num">Previous 3 avg</th><th>Trend</th><th class="num">Practices rated</th><th>Weakest area</th><th>Focus</th></tr>${rows.map(r=>`<tr><td>${esc(r.who.name)} <span class="muted">${esc(r.who.team)}</span></td><td class="num">${r.st.hist.toFixed(2)}</td><td class="num">${r.st.last3.toFixed(2)}</td><td class="num">${avg2(r.st.prev3)}</td><td>${r.st.trend}</td><td class="num">${r.st.count}</td><td>${esc(r.st.weakest||'—')}</td><td>${r.st.weakest?esc(FOCUS.player[r.st.weakest]||'—'):'—'}</td></tr>`).join('')}</table></div></div>`;let card2=`<div class="card"><h2>Player averages by area</h2><div style="overflow:auto"><table class="tbl"><tr><th>Player</th>${INDIV_AREAS.map(c=>`<th class="num">${esc(c)}</th>`).join('')}<th class="num">Overall</th></tr>${rows.map(r=>`<tr><td>${esc(r.who.name)} <span class="muted">${esc(r.who.team)}</span></td>${INDIV_AREAS.map(c=>`<td class="num">${avg2(r.st.areaAvg[c])}</td>`).join('')}<td class="num">${r.st.hist.toFixed(2)}</td></tr>`).join('')}</table></div></div>`;return card1+card2}

if(tab==='Team Eval'){let sc=teamScores(a),complete=teamComplete(a),ov=complete?teamOverall(a):null;let rated=TEAM_AREAS.filter(n=>typeof te(a)[n]==='number'&&te(a)[n]>0).length;let subjBoxes=TEAM_SUBJECTS.map(s=>{let v=sc[s.name];return `<div class="stat"><span class="muted">${esc(s.name)}</span><b>${v?v.avg.toFixed(2)+' / 5':'—'}</b><div class="muted">${v?v.rated+' of '+v.total+' rated':'0 of '+s.areas.length+' rated'}</div></div>`}).join('');let report;if(complete){let arr=TEAM_SUBJECTS.map(s=>({name:s.name,avg:sc[s.name].avg}));arr.sort((x,y)=>y.avg-x.avg);report=arr[0].avg===arr[arr.length-1].avg?'<p><b>All three subjects are even.</b></p>':`<p><b>${esc(arr[0].name)} is the strongest area.</b> ${esc(arr[arr.length-1].name)} requires the most attention.</p>`}else report=`<p class="muted">Rate all 14 areas to complete the report — ${rated} of 14 rated so far. Subject averages use only rated areas; missing ratings do not count as zero.</p>`;h=head+`<div class="card"><h2>Team evaluation</h2><div class="grid"><div class="stat"><b>14</b>Team rating areas</div><div class="stat"><b>10</b>Individual rating areas</div><div class="stat"><b>3</b>Team evaluation subjects</div><div class="stat"><b>1</b>Overall practice rating</div></div><p class="muted">1 Needs instruction · 2 Developing · 3 Inconsistent · 4 Proficient · 5 Game-ready — 5 is always strong performance.</p></div>`+`<div class="card"><h2>Practice Performance Report</h2><p class="muted">DVH COACHING OS · ${esc(team().name)} · ${esc(a.date+' · '+a.name)}</p><div class="scorebox" style="margin-bottom:12px"><span class="muted" style="color:#e2c98c">OVERALL PRACTICE RATING</span><div class="score">${ov!==null?ov.toFixed(2)+' / 5.00':'—'}</div></div><div class="grid">${subjBoxes}</div>${report}</div>`+TEAM_SUBJECTS.map(s=>`<div class="card"><h2>${esc(s.name)}</h2>${s.areas.map(ar=>{let v=te(a)[ar.n]||0;return `<div class="drill"><div class="row" style="margin:6px 0"><div class="grow"><b>${esc(ar.n)}</b><div class="muted">${esc(ar.d)}</div>${ar.rev?`<div class="muted">${esc(ar.rev)}</div>`:''}</div><select onchange="teamRate('${ar.n}',this.value)">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${n===v?'selected':''}>${n||'—'}</option>`).join('')}</select></div></div>`}).join('')}</div>`).join('')}
if(tab==='Scoreboard'){h=head+`<div class="grid">${['NAVY','GOLD'].map((n,i)=>`<div class="scorebox"><b>${n}</b><div class="score">${a.score[i]}</div>${[1,2,3,-1].map(v=>btn(v>0?'+'+v:v,`score(${i},${v})`,'alt')).join('')}</div>`).join('')}</div><div class="card" style="margin-top:12px">${btn('Reset score','resetScore()','alt')}<p class="muted">Use +1 for stops, rotations or free throws; +2/+3 for baskets.</p></div>`}
if(tab==='Games'){h=head+gamesHTML()}
if(tab==='History'){h=`<div class="card"><h2>Practice history</h2>${s.history.length?s.history.slice().reverse().map(x=>`<details class="drill"><summary>${esc(x.date+' · '+x.teamName+' · '+x.name)}</summary><p>${esc(x.notes)}</p><p>Score: ${x.score.join(' – ')}</p><p>${x.drills.filter(d=>d.done).length}/${x.drills.length} drills completed</p>${historyDetailHTML(x)}${btn('Duplicate as new practice',`fromHistory('${x.archiveId}')`,'alt')}</details>`).join(''):'No saved sessions yet. Save a session from Live.'}</div>`+teamHistoryHTML()+playerHistoryHTML()}
if(tab==='Backup'){h=`<div class="card"><h2>Local storage & backup</h2><p>Records save in this browser on this device. Private browsing, clearing browser data or moving the file can affect access. Export regularly. No cloud sync or user accounts.</p>${btn('Export JSON backup','exportData()','gold')}<label>Restore backup (replaces current records)</label><input type="file" accept=".json,application/json" onchange="restore(this)"><p>${btn('Print current view','window.print()','alt')}</p></div>`}document.getElementById('main').innerHTML=h;tick();gameTick()}
let alarmOn=false,alarmTimer=null,audioCtx=null,wakeLock=null,keepOsc=null,keepGain=null,autoAdvanceTimer=null,autoPaused=false;
let autoAdvanceOn=false;try{autoAdvanceOn=localStorage.getItem('dvh-os-auto')==='1'}catch(e){}
function ensureAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function startKeepAlive(){try{ensureAudio();if(!audioCtx||keepOsc)return;keepGain=audioCtx.createGain();keepGain.gain.value=0;keepOsc=audioCtx.createOscillator();keepOsc.frequency.value=440;keepOsc.connect(keepGain);keepGain.connect(audioCtx.destination);keepOsc.start()}catch(e){}}
function stopKeepAlive(){try{if(keepOsc){keepOsc.stop();keepOsc.disconnect();keepOsc=null}}catch(e){}try{if(keepGain){keepGain.disconnect();keepGain=null}}catch(e){}}
async function beepCycle(){try{if(navigator.vibrate)navigator.vibrate([300,100,300,100,300])}catch(e){}try{ensureAudio()}catch(e){}if(!audioCtx)return;try{await Promise.race([audioCtx.resume(),new Promise(r=>setTimeout(r,500))])}catch(e){}if(audioCtx.state==='suspended'){try{await Promise.race([audioCtx.resume(),new Promise(r=>setTimeout(r,500))])}catch(e){}}try{let t0=audioCtx.currentTime;for(let i=0;i<3;i++){let s=t0+i*0.5,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=880;g.gain.setValueAtTime(0.0001,s);g.gain.linearRampToValueAtTime(0.5,s+0.02);g.gain.setValueAtTime(0.5,s+0.27);g.gain.linearRampToValueAtTime(0.0001,s+0.3);o.connect(g);g.connect(audioCtx.destination);o.start(s);o.stop(s+0.32)}}catch(e){}}
function showAlarmOverlay(){try{let ov=document.getElementById('alarmOverlay');if(!ov)return;let d=p().drills[p().index];let nm=document.getElementById('alarmDrill');if(nm)nm.textContent=d?d.name:'';let st=document.getElementById('alarmStatus');let pb=document.getElementById('alarmPause');let rb=document.getElementById('alarmResume');let last=p().index>=p().drills.length-1;if(st){if(autoPaused){st.textContent=last?'Paused on the last drill — tap Resume to finish the practice.':'Paused — tap Resume to continue to the next drill.';st.style.display=''}else if(autoAdvanceTimer){st.textContent=last?'Last drill — practice ends shortly. Tap Stop alarm to finish now.':'Next drill starting shortly — tap Stop alarm to go now.';st.style.display=''}else{st.textContent='';st.style.display='none'}}if(pb)pb.style.display=autoAdvanceTimer&&!autoPaused?'':'none';if(rb)rb.style.display=autoPaused?'':'none';ov.style.display='flex'}catch(e){}}
function hideAlarmOverlay(){try{let ov=document.getElementById('alarmOverlay');if(ov)ov.style.display='none'}catch(e){}}
function cancelAutoAdvance(){try{if(autoAdvanceTimer){clearTimeout(autoAdvanceTimer);autoAdvanceTimer=null}}catch(e){}}
function scheduleAutoAdvance(){try{cancelAutoAdvance();autoAdvanceTimer=setTimeout(()=>{autoAdvanceTimer=null;if(!autoPaused)autoAdvance()},5000)}catch(e){}}
function autoAdvance(){try{cancelAutoAdvance();autoPaused=false;let a=p();let isLast=a.index>=a.drills.length-1;stopAlarm();next(true);if(!isLast)start()}catch(e){}}
function alarmStop(){try{if(alarmOn&&autoAdvanceOn){autoPaused=false;autoAdvance();return}}catch(e){}stopAlarm()}
function pauseAuto(){try{if(!alarmOn)return;cancelAutoAdvance();autoPaused=true;if(alarmTimer){clearInterval(alarmTimer);alarmTimer=null}showAlarmOverlay()}catch(e){}}
function resumeAuto(){try{if(!autoPaused)return;autoPaused=false;autoAdvance()}catch(e){}}
function setAuto(v){try{autoAdvanceOn=!!v;try{localStorage.setItem('dvh-os-auto',autoAdvanceOn?'1':'0')}catch(e){}if(!autoAdvanceOn){cancelAutoAdvance();autoPaused=false}if(alarmOn)showAlarmOverlay()}catch(e){}}
function startAlarm(){if(alarmOn)return;alarmOn=true;try{ensureAudio()}catch(e){}if(autoAdvanceOn)scheduleAutoAdvance();showAlarmOverlay();beepCycle();alarmTimer=setInterval(beepCycle,3000)}
function stopAlarm(){cancelAutoAdvance();autoPaused=false;if(!alarmOn&&!alarmTimer)return;alarmOn=false;if(alarmTimer){clearInterval(alarmTimer);alarmTimer=null}hideAlarmOverlay();if(!p().timer.end)stopKeepAlive();let el=document.getElementById('clock');if(el)el.classList.remove('alarming');let sb=document.getElementById('stopAlarm');if(sb)sb.style.display='none'}
async function requestWakeLock(){try{if('wakeLock' in navigator&&!wakeLock)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWakeLock(){try{if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}
function tick(){let el=document.getElementById('clock');if(!el)return;let t=p().timer,r=t.end?Math.max(0,Math.ceil((t.end-Date.now())/1000)):t.remaining;if(t.end&&r===0){t.end=null;t.remaining=0;save();releaseWakeLock();startAlarm()}el.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');if(alarmOn)el.classList.add('alarming');let sb=document.getElementById('stopAlarm');if(sb)sb.style.display=alarmOn?'':'none';if(alarmOn)showAlarmOverlay();else hideAlarmOverlay()}
function start(){let t=p().timer;if(!t.end&&t.remaining>0){ensureAudio();stopAlarm();t.end=Date.now()+t.remaining*1000;save();tick();requestWakeLock();startKeepAlive()}}function pause(){stopAlarm();stopKeepAlive();releaseWakeLock();let t=p().timer;if(t.end){t.remaining=Math.max(0,Math.ceil((t.end-Date.now())/1000));t.end=null;save();tick()}}function extend(){stopAlarm();let t=p().timer;if(t.end)t.end+=60000;else t.remaining+=60;save();tick()}function resetTimer(){stopAlarm();stopKeepAlive();releaseWakeLock();p().timer={remaining:(p().drills[p().index]?.min||0)*60,end:null};save();tick()}function jump(i){p().index=i;resetTimer();save();render()}function next(done){let a=p();if(a.drills[a.index]&&done)a.drills[a.index].done=true;jump(Math.min(a.index+1,a.drills.length))}function mark(i,v){p().drills[i].done=v;save();render()}
function blank(t){return {id:uid(),team:t,name:'New practice',date:new Date().toISOString().slice(0,10),location:'',coach:'',focus:'',drills:[],notes:'',attendance:{},ratings:{},teamEval:{},score:[0,0],index:0,timer:{remaining:0,end:null}}}function newPlan(){cancelAutoAdvance();autoPaused=false;let a=blank(s.team);s.plans.push(a);s.active=a.id;save();render()}function switchTeam(id){cancelAutoAdvance();autoPaused=false;s.team=id;let a=s.plans.find(x=>x.team===id);if(!a){a=blank(id);s.plans.push(a)}s.active=a.id;save();render()}function switchPlan(id){cancelAutoAdvance();autoPaused=false;s.active=id;save();render()}function clonePlan(x){cancelAutoAdvance();autoPaused=false;let a=JSON.parse(JSON.stringify(x));Object.assign(a,{id:uid(),date:new Date().toISOString().slice(0,10),notes:'',attendance:{},ratings:{},score:[0,0],index:0});a.teamEval={};a.drills.forEach(d=>d.done=false);a.timer={remaining:(a.drills[0]?.min||0)*60,end:null};s.plans.push(a);s.team=a.team;s.active=a.id;save();go('Planner')}function duplicate(){clonePlan(p())}function editDrill(i,k,v){p().drills[i][k]=k==='min'?Math.max(0,Math.round(Number(v)||0)):v;if(k==='min'){resetTimer();save();render()}else save()}function move(i,n){let d=p().drills,j=i+n;if(j<0||j>=d.length)return;[d[i],d[j]]=[d[j],d[i]];jump(0)}function removeDrill(i){p().drills.splice(i,1);jump(0)}function addDrill(){p().drills.push(makeDrill(['New drill',5,'']));if(p().drills.length===1)resetTimer();save();render()}function newLibrary(){s.library.push(makeDrill(['New drill',5,'']));save();render()}function libEdit(i,k,v){s.library[i][k]=k==='min'?Math.max(0,Math.round(Number(v)||0)):v;save()}function useLib(i){let d=s.library[i];p().drills.push(makeDrill([d.name,d.min,d.notes]));if(p().drills.length===1)resetTimer();save();go('Planner')}function delLib(i){if(confirm('Delete library drill?')){s.library.splice(i,1);save();render()}}function addTeam(){let n=document.getElementById('teamName').value.trim();if(n){let id=uid();s.teams.push({id,name:n,players:[]});switchTeam(id)}}function addPlayer(){let n=document.getElementById('playerName').value.trim();if(n){team().players.push({id:uid(),name:n});save();render()}}function removePlayer(id){if(confirm('Remove player from roster? Saved history remains.')){team().players=team().players.filter(x=>x.id!==id);save();render()}}function att(id,v){p().attendance[id]=v;save()}function rate(id,c,v){p().ratings[id]??={};p().ratings[id][c]=c==='notes'?v:Number(v);save();let el=document.getElementById('pa-'+id);if(el)el.textContent=practiceAvgText(p(),id)}function score(i,v){p().score[i]=Math.max(0,p().score[i]+v);save();render()}function resetScore(){p().score=[0,0];save();render()}function archive(){pause();let a=JSON.parse(JSON.stringify(p()));a.archiveId=uid();a.teamName=team().name;a.savedAt=new Date().toISOString();s.history.push(a);save();go('History')}function fromHistory(id){clonePlan(s.history.find(x=>x.archiveId===id))}function exportData(){let u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='DVH-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.teams)||!Array.isArray(x.plans)||!Array.isArray(x.library)||!Array.isArray(x.history)||!x.teams.some(t=>t.id===x.team)||!x.plans.some(p=>p.id===x.active))throw Error();if(confirm('Replace all local records with this backup?')){cancelAutoAdvance();autoPaused=false;s=x;normGames();s.plans.forEach(pl=>{if(!pl.teamEval||typeof pl.teamEval!=='object')pl.teamEval={}});s.history.forEach(pl=>{if(!pl.teamEval||typeof pl.teamEval!=='object')pl.teamEval={}});save();go('Live')}}catch(e){alert('Invalid DVH backup.')}}document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(p().timer.end)requestWakeLock();if(alarmOn){try{ensureAudio()}catch(e){}beepCycle()}});save();render();setInterval(()=>{tick();gameTick()},250);
</script><script>
const statusEl=document.getElementById('offlineStatus');
function statusUpdate(){statusEl.textContent=(navigator.onLine?'Online':'Offline')+' · '+(navigator.serviceWorker?.controller?'Offline cache active':'Offline setup pending')+' · Records stored on this device';}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(statusUpdate).catch(()=>{statusEl.textContent='Offline setup failed. Open the hosted HTTPS site and reload.'});navigator.serviceWorker.addEventListener('controllerchange',statusUpdate);window.addEventListener('online',statusUpdate);window.addEventListener('offline',statusUpdate);}else{statusEl.textContent='Offline installation requires a supported browser and HTTPS.';}
</script></body></html>
