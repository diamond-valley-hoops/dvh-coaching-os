const FOCUS={player:{"Ball handling":"10 extra minutes dribbling after practice — weak hand only, keep the dribble alive. Drill: Mason Elite two-ball series, weak hand only; lateral cone dribble.","Finishing":"50 layups after practice — rim-run, both sides, finish through contact. Drill: Layup Fast Break lines; drop-step series from both blocks.","Shooting":"100 shots before or after practice — form-first, hold the follow-through. Drill: Form shooting from the block, then spot-up jumpers from five spots.","Ball movement":"Drive. Kick. Swing. — extra pass before every shot in live finish; don't pick it up before you decide. Drill: 3-on-3 Drive. Kick. Swing. — drive, kick, swing, shoot.","Off-ball movement":"10 minutes of V-cuts and slot cuts after practice — cut with purpose, move without the ball. Drill: V-cut series into catch-and-go; slot cut to the rim.","Containment":"10 minutes walling up after practice — stay attached, chest square, shade the dominant hand, no middle. Drill: 1-on-1 wall-up — chest square, shade the dominant hand; no-middle closeout drill.","Help and rotation":"Help-and-recover reps — load up early from the gaps, stunt and recover, talk it. Drill: 4-on-4 shell — help early from the gaps, stunt and recover.","Rebounding":"Box-out block — hit first, pursue second, finish every possession. Drill: Closeout and box out — hit first, pursue second, secure the ball.","Communication":"Call it every rep — screen, help, switch, loud, every possession. Drill: Shell with talk — every defender calls screen, help, switch.","Effort and discipline":"DAWG House standard — effort every rep, discipline every possession. Drill: DAWG spell-out — defensive slides, sprint back and talk, closeout and box out, dive for the loose ball."},team:{"Picking each other up":"Next-play energy — pick each other up after every mistake, celebrate the extra pass. Drill: Next-play scrimmage — mistake, reset, next play; extra pass gets the praise.","Communication":"Team talk — every player calls what they see, every possession. Drill: 5-on-0 with calls — every cut, screen, and help called out loud.","Team effort":"Effort standard — sprint the floor both ways, every rep. Drill: Full-court sprint-back — first three steps on every change of possession.","Encouragement":"Bench and floor energy — build each other up, loud on every make. Drill: Live Finish with bench energy — bench calls out makes and extra passes.","Ball movement":"Drive. Kick. Swing. — extra pass, move it before you shoot it. Drill: 3-on-3 Drive. Kick. Swing. — drive, kick, swing, shoot.","Layup execution":"Layup Fast Break — finish at the rim, cut the missed layups. Drill: Layup Fast Break lines — rim-run, finish through contact, both sides.","Ball security":"Strong with the ball — don't pick it up early, value every possession. Drill: Pressure handling — 1-on-2 keep-away, strong with the ball, no live-ball turnovers.","Offensive communication":"Call the action — Miami, Twist, V-Screen, loud and early. Drill: 5-on-0 actions with calls — Miami, Twist, V-Screen, MOB, loud and early.","Actions used":"Run the actions — Miami, Twist, V-Screen, MOB, with pace. Drill: Actions circuit — rep Miami, Twist, V-Screen, MOB, each with pace.","Defensive communication":"Talk on defense — call the screen, call the help, call the switch. Drill: Shell with talk — call the screen, help, switch, every rep.","Defensive stops":"No middle — three stops is a kill, string kills together. Drill: Kill drill — three stops in a row, then string kills together.","Defensive sprints":"Sprint back on defense — first three steps, no jogging. Drill: Sprint-back drill — first three steps on every change of possession.","Defensive rotations":"Rotate on the catch — help early, recover together. Drill: 4-on-4 shell — rotate on the catch, help early, recover together.","Hand shading":"Shade the dominant hand — top foot high, force baseline. Drill: 1-on-1 shade drill — top foot high, force baseline, no middle."}};

 return `<div class="card"><h2>Development report card — ${esc(pl.name)}</h2><p class="muted">Last 30 days · ${esc(f.team.name)} · Parent-friendly summary. Print from the Backup tab or your browser.</p><div class="grid"><div class="stat"><span class="muted">Overall development rating</span><b>${ov!==null?ov.toFixed(2)+" / 5":"—"}</b></div><div class="stat"><span class="muted">Training sessions (30 days)</span><b>${sess30}</b></div><div class="stat"><span class="muted">Assignments completed</span><b>${hwDone} / ${hw.length}</b></div><div class="stat"><span class="muted">Culture rating</span><b>${cultLatest?(()=>{let v=Object.values(cultLatest.ratings).filter(n=>typeof n==="number"&&n>0);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2)+" / 5":"—"})():"—"}</b></div></div><h3 style="margin:12px 0 4px">Skill averages</h3><div style="overflow:auto"><table class="tbl"><tr><th>Skill group</th><th class="num">Current</th><th class="num">Previous</th></tr>${rows}</table></div><h3 style="margin:12px 0 4px">Performance testing — baseline vs current</h3>${testLines.length?testLines.map(x=>`<p>${x.good?"▲":"▼"} ${esc(x.t)}</p>`).join(""):'<p class="muted">No repeated tests yet — record the same test twice to see progress.</p>'}<h3 style="margin:12px 0 4px">Areas of improvement</h3>${improved.length?improved.map(x=>`<p>▲ ${esc(x)}</p>`).join(""):'<p class="muted">No measured improvement yet.</p>'}<h3 style="margin:12px 0 4px">Areas of regression</h3>${regressed.length?regressed.map(x=>`<p>▼ ${esc(x)}</p>`).join(""):'<p class="muted">No measured regression.</p>'}<h3 style="margin:12px 0 4px">Culture ratings</h3>${cultLatest?DEV_CULTURE.map(c=>`<p>${esc(c.n)}: <b>${cultLatest.ratings[c.n]||"—"}</b> <span class="muted">${esc(c.d)}</span></p>`).join(""):'<p class="muted">No culture ratings yet.</p>'}<h3 style="margin:12px 0 4px">Skills mastered</h3><p>${mastered.length?esc(mastered.join(", ")):"None yet."}</p><h3 style="margin:12px 0 4px">Skills still developing</h3><p>${developing.length?esc(developing.map(k=>k+" (Level "+m[k]+")").join(", ")):"None recorded yet."}</p><h3 style="margin:12px 0 4px">Coach observations</h3><p>${esc(pl.coachObservations||"—")}</p><h3 style="margin:12px 0 4px">Goals for the next 30 days</h3><p>${esc(pl.shortTermGoals||"—")}</p><p class="muted">Long-term goals: ${esc(pl.longTermGoals||"—")}</p></div>`;
}
function devHTML(){

p on ${esc(f.team.name)} —</option>${s.teams.filter(t=>t.id!==f.team.id).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></div>`;
 let dash=`<div class="card"><h2>Development dashboard — ${esc(pl.name)}</h2><div class="grid"><div class="stat"><span class="muted">Overall development rating</span><b>${ov!==null?ov.toFixed(2)+" / 5":"—"}</b></div><div class="stat"><span class="muted">Recent change</span><b>${change===null?"—":(change>=0?"+":"")+change.toFixed(2)}</b></div><div class="stat"><span class="muted">Training sessions</span><b>${sessions}</b></div><div class="stat"><span class="muted">Culture rating</span><b>${cultAvg!==null?cultAvg.toFixed(2)+" / 5":"—"}</b></div></div><p class="muted">Individual development averages — separate from team-practice evaluation averages. Team-practice average (History): <b>${ps?ps.hist.toFixed(2)+" / 5":"—"}</b> · Individual development average: <b>${ov!==null?ov.toFixed(2)+" / 5":"—"}</b></p><div style="overflow:auto"><table class="tbl"><tr><th>Skill group</th><th class="num">Rating</th><th class="num">Change</th><th>Priority</th></tr>${DEV_GROUPS.map(g=>{let a=av[g.name],b=pav[g.name];let ch=(a!=null&&b!=null)?a-b:null;let isPri=accepted?accepted.includes(g.name):rec.includes(g.name);return `<tr><td>${esc(g.name)}</td><td class="num">${a!=null?a.toFixed(2):"—"}</td><td class="num">${ch===null?"—":(ch>=0?"+":"")+ch.toFixed(2)}</td><td>${isPri?"★ Priority":""}</td></tr>`}).join("")}</table></div><h3 style="margin:12px 0 4px">Recommended training priorities</h3>${rec.length?`<p>${rec.map((r,i)=>(i+1)+". "+esc(r)).join(" · ")}</p>`:'<p class="muted">No assessment yet — rate the skill groups below and priorities will appear here.</p>'}${accepted?`<p><b>Accepted priorities:</b> ${esc(accepted.join(", ")||"—")}</p>`:""}<div class="row">${btn("Accept recommended priorities","devAcceptPriorities('"+pid+"')","gold")}<span class="muted">Or modify them:</span>${[0,1,2].map(i=>`<select onchange="devSetPriority('${pid}',${i},this.value)"><option value="">—</option>${DEV_GROUPS.map(g=>`<option ${((accepted||rec)[i]===g.name)?"selected":""}>${esc(g.name)}</option>`).join("")}</select>`).join("")}</div><div class="row" style="margin-top:8px">${btn("Generate development plan","devGeneratePlan('"+pid+"')","gold")}<span class="muted">Drafts a workout from the lowest groups and test results — you accept or modify it before it becomes active.</span></div></div>`;

 let testRows=DEV_TESTS.map(t=>{let rows=devTestList(pid).filter(e=>e.test===t.key);let imp=devTestImprovement(pid,t.key);let first=rows.length?rows[0]:null,last=rows.length?rows[rows.length-1]:null;return `<tr><td>${esc(t.name)}</td><td class="num">${first?devTestDisplay(first):"—"}</td><td class="num">${last?devTestDisplay(last):"—"}</td><td>${devImpText(imp)}</td><td class="num">${rows.length}</td></tr>`}).join("");
 let testing=`<div class="card"><h2>Performance testing</h2><p class="muted">Objective results, not coach ratings. Record the same test twice to measure progress. Shooting makes and percentages, jump height and distance improve UP; sprint and agility times and dribbling errors improve DOWN. Tests are age-appropriate and run under consistent conditions.</p><div class="row"><label style="display:flex;flex-direction:column;gap:4px">Test<select id="devTestKey">${DEV_TESTS.map(t=>`<option value="${t.key}">${esc(t.name)}</option>`).join("")}</select></label><label style="display:flex;flex-direction:column;gap:4px">Date<input id="devTestDate" type="date" value="${today()}"></label><label style="display:flex;flex-direction:column;gap:4px">Makes<input id="devTestMakes" type="number" min="0" placeholder="makes"></label><label style="display:flex;flex-direction:column;gap:4px">Attempts<input id="devTestAttempts" type="number" min="0" placeholder="attempts"></label><label style="display:flex;flex-direction:column;gap:4px">Time (sec)<input id="devTestTime" type="number" min="0" step="0.01" placeholder="seconds"></label><label style="display:flex;flex-direction:column;gap:4px">Errors<input id="devTestErrors" type="number" min="0" placeholder="errors"></label><label style="display:flex;flex-direction:column;gap:4px">Value<input id="devTestValue" type="number" step="0.01" placeholder="height / distance"></label>${btn("Record test","devAddTest('"+pid+"')","gold")}</div><div style="overflow:auto"><table class="tbl"><tr><th>Test</th><th class="num">Baseline</th><th class="num">Current</th><th>Improvement</th><th class="num">Records</th></tr>${testRows}</table></div></div>`;
 let myWOs=s.devWorkouts.filter(x=>x.playerId===pid).slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
 let wo=`<div class="card"><h2>Individual training plan builder</h2><p class="muted">Workouts of 30, 45, 60 or 90 minutes. Blocks follow the DVH template — Athletic preparation, Ball handling, Finishing (primary focus), Secondary skill development, Game application, Pressure challenge, Cooldown and evaluation — scaled to the duration. Pick drills from the Library, add video links, track makes live.</p><div class="row"><label style="display:flex;flex-direction:column;gap:4px">Duration<select id="devWODuration">${[30,45,60,90].map(d=>`<option value="${d}" ${d===60?"selected":""}>${d} min</option>`).join("")}</select></label><label style="display:flex;flex-direction:column;gap:4px">Primary focus<input id="devWOFocus" placeholder="e.g. Finishing"></label>${btn("Create workout","devNewWorkout('"+pid+"')","gold")}</div>${myWOs.length?myWOs.map(w=>devWorkoutHTML(w)).join(""):'<p class="muted">No individual workouts yet for '+esc(pl.name)+'.</p>'}</div>`;
 let m=devMasteryMap(pid);
 let skillNames=Object.keys(m);DEV_MASTERY_SKILLS.forEach(sk=>{if(!(sk in m))skillNames.push(sk)});
 let mast=`<div class="card"><h2>Skill mastery — Brick by Brick, Built, Not Born</h2><p class="muted">Every skill moves through five levels. A player is not considered to have mastered a crossover just because they can do it around a cone — mastery takes live reads and game application.</p>${DEV_MASTERY_LEVELS.map(l=>`<p><b>${l.n}. ${l.name}</b> — ${l.d}</p>`).join("")}${skillNames.map(sk=>{let v=m[sk]||0;let lv=DEV_MASTERY_LEVELS.find(x=>x.n===v);return `<div class="row" style="margin:6px 0"><span class="grow"><b>${esc(sk)}</b>${lv?` <span class="muted">— ${lv.name}</span>`:""}</span><select onchange="devMasterySet('${pid}','${esc(sk)}',this.value)">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${n===v?"selected":""}>${n===0?"—":n+" "+DEV_MASTERY_LEVELS[n-1].name}</option>`).join("")}</select></div>`}).join("")}<div class="row"><input id="devNewSkill" placeholder="Add a skill (e.g. Crossover)" class="grow">${btn("Add skill","devAddMasterySkill('"+pid+"')","alt")}</div></div>`;
 let cultEntry=devCultureList(pid).find(x=>x.date===devCultureDate)||null;
 let cult=`<div class="card"><h2>Individual DAWG House culture rating</h2><p class="muted">Character and training habits — kept separate from basketball skill ratings and never mixed into skill averages. 1 Needs instruction · 2 Developing · 3 Inconsistent · 4 Proficient · 5 Game-ready.</p><div class="row"><label>Date</label><input type="date" value="${devCultureDate}" onchange="devSetCultureDate(this.value)"></div>${DEV_CULTURE.map(c=>{let v=cultEntry?cultEntry.ratings[c.n]||0:0;return `<div class="row" style="margin:6px 0"><div class="grow"><b>${esc(c.n)}</b><div class="muted">${esc(c.d)}</div></div><select onchange="devCultureRate('${pid}','${esc(c.n)}',this.value)">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${n===v?"selected":""}>${n||"—"}</option>`).join("")}</select></div>`}).join("")}<p class="muted">${devCultureList(pid).length} culture rating${devCultureList(pid).length===1?"":"s"} on file.</p></div>`;
 let hwList=s.devHomework.filter(x=>x.playerId===pid);
 let hwHtml=`<div class="card"><h2>At-home assignments — Homework Center</h2><p class="muted">Assign workouts to complete independently. Self-reported results are flagged "Self-reported" — they are not coach-verified performance testing. Parent confirmation is recorded where appropriate.</p><div class="row">${DEV_HOMEWORK_PRESETS.map((p,i)=>btn(esc(p.title)+" — "+p.target+" "+p.unit,"devAddHomework('"+pid+"',"+i+")","alt")).join("")}</div><div class="row"><input id="devHwTitle" placeholder="Custom assignment" class="grow"><input id="devHwTarget" type="number" min="0" placeholder="Target" style="width:90px"><input id="devHwUnit" placeholder="unit (min/makes)" style="width:130px">${btn("Add assignment","devAddHomework('"+pid+"')","gold")}</div>${hwList.length?hwList.map(hw=>`<div class="drill"><div class="row"><b class="grow">${esc(hw.title)} — ${hw.target} ${esc(hw.unit)} / day</b>${hw.done?(hw.selfReported?'<span class="flag">Self-reported</span>':'<span class="flag ok">Coach-verified</span>'):""}<span class="muted">${esc(hw.assigned||"")}</span></div><div class="row"><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" ${hw.done?"checked":""} onchange="devHwDone('${hw.id}',this.checked)"> Completed</label><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" ${hw.parentConfirmed?"checked":""} onchange="devHwSet('${hw.id}','parentConfirmed',this.checked)"> Parent confirmed</label>${hw.done&&hw.selfReported?btn("Mark coach-verified","devHwVerify('"+hw.id+"')","alt"):""}</div>${field("Player-reported result",hw.playerResult||"","devHwSet('"+hw.id+"','playerResult',this.value)")}${field("Due date",hw.due||"","devHwSet('"+hw.id+"','due',this.value)",'date')}${area("Coach feedback",hw.coachFeedback||"","devHwSet('"+hw.id+"','coachFeedback',this.value)")}${btn("Delete","devHwDelete('"+hw.id+"')","danger")}</div>`).join(""):'<p class="muted">No assignments yet for '+esc(pl.name)+'.</p>'}</div>`;
 return head+prof+dash+assess+testing+wo+mast+cult+hwHtml+devReportHTML(pid);

function devWorkoutHTML(w){
 let blocks=w.blocks.map((b,bi)=>{
  let libOpts=s.library.map((d,i)=>`<option value="${i}" ${d.name===b.drill?"selected":""}>${esc(d.name)}</option>`).join("");
  let isTimer=devTimer.wid===w.id&&devTimer.bi===bi;

"Save session","devSaveSession('"+w.id+"',"+bi+")","gold")}</div><div class="row"><span class="muted">Block timer</span>${isTimer?`<div class="clock" id="devclock" style="font-size:36px">--:--</div>${btn("Pause","devTimerPause()")}${btn("Reset","devTimerReset()","alt")}`:`${btn("Start block timer","devTimerStart('"+w.id+"',"+bi+")","gold")}`}</div><div class="row">${btn("Remove block","devRemoveBlock('"+w.id+"',"+bi+")","danger")}</div></div>`;
 }).join("");
 let draft=w.status==="draft"?`<p><b>Generated draft plan — review it, then accept it or edit it.</b></p>${btn("Accept plan","devAcceptPlan('"+w.id+"')","gold")}`:"";
 return `<details class="drill" ${w.status==="active"||w.id===devOpenWorkout?"open":""} ontoggle="devOpenWorkout=this.open?'${w.id}':''"><summary>${esc(w.date)} · ${w.duration} min · ${esc(w.focus||"Individual workout")} <span class="muted">${w.source==="generated"?"generated draft":w.status}</span></summary>${draft}${field("Focus",w.focus,"devEditWorkout('"+w.id+"','focus',this.value)")}${field("Date",w.date,"devEditWorkout('"+w.id+"','date',this.value)",'date')}<p class="muted">${w.blocks.reduce((n,x)=>n+(x.min||0),0)} planned minutes</p>${blocks}${btn("Add block","devAddBlock('"+w.id+"')","alt")} <label>Post-workout evaluation</label><div class="row"><select onchange="devSetPostEval('${w.id}','effort',this.value)">${["","Low","Medium","High"].map(v=>`<option value="${v}" ${v===((w.postEval&&w.postEval.effort)||"")?"selected":""}>${v||"Effort —"}</option>`).join("")}</select><select onchange="devSetPostEval('${w.id}','rating',this.value)">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${n===((w.postEval&&w.postEval.rating)||0)?"selected":""}>${n||"Rating —"}</option>`).join("")}</select></div>${area("Post-workout notes",w.postEval?w.postEval.notes:"","devSetPostEval('"+w.id+"','notes',this.value)")}<div class="row">${w.status!=="done"?btn("Mark workout complete","devCompleteWorkout('"+w.id+"')","gold"):"<b>Completed</b>"} ${btn("Delete workout","devDeleteWorkout('"+w.id+"')","danger")}</div></details>`;

  var q = function (v) { return String(v == null ? '' : v).replace(/'/g, '&#39;'); };

  var SET_DEF = { autoExport: false, voice: false, shotClock: 24, attThreshold: 80, snap: true };

  function st() {
    if (!s.settings || typeof s.settings !== 'object') s.settings = {};
    for (var k in SET_DEF) if (typeof s.settings[k] === 'undefined') s.settings[k] = SET_DEF[k];
    return s.settings;
  }

  function migrate() {
    st();
    try { normPlayers(); } catch (e) { }
    if (!Array.isArray(s.playbook)) s.playbook = [];
    if (!s.scout || typeof s.scout !== 'object') s.scout = {};
    if (!s.shots || typeof s.shots !== 'object') s.shots = {};
    if (!s.lineups || typeof s.lineups !== 'object') s.lineups = {};
    if (!s.pm || typeof s.pm !== 'object') s.pm = {};
    if (!s.rotation || typeof s.rotation !== 'object') s.rotation = {};
    if (!s.venue || typeof s.venue !== 'object') s.venue = {};
    if (!Array.isArray(s.history)) s.history = [];
    (s.library || []).forEach(function (d) { if (!Array.isArray(d.tags)) d.tags = []; });
  }

  /* ---------------------------------------------------------------- toast */
  function toast(msg, ms) {
    var el = $('dvhToast');
    if (!el) { document.body.insertAdjacentHTML('beforeend', '<div id="dvhToast"></div>'); el = $('dvhToast'); }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, ms || 2600);
  }

  function persist() { try { save(); } catch (e) { } }

  /* ------------------------------------------------------- mobile chrome */
  var PRIMARY = ['Live', 'Planner', 'Games', 'Development'];

  function ensureChrome() {
    if (!$('bottombar')) {
      document.body.insertAdjacentHTML('beforeend',
        '<div id="bottombar"><div class="bbrow" id="bbrow"></div></div>' +
        '<div id="moresheet"><div class="sheet"><div class="row"><b class="grow">All sections</b>' +
        '<button class="alt" onclick="dvhMore(false)">Close</button></div>' +
        '<div class="mgrid" id="mgrid"></div></div></div>');
    }
  }

  function renderChrome() {
    ensureChrome();
    var row = $('bbrow'), grid = $('mgrid');
    if (row) {
      row.innerHTML = PRIMARY.map(function (t) {
        return '<button class="bb' + (tab === t ? ' on' : '') + '" onclick="go(\'' + t + '\')">' + t + '</button>';
      }).join('') +
        '<button class="bb' + (PRIMARY.indexOf(tab) < 0 ? ' on' : '') + '" onclick="dvhMore(true)">More</button>';
    }
    if (grid) {
      grid.innerHTML = tabs.map(function (t) {
        return '<button class="' + (tab === t ? 'gold' : 'alt') + '" onclick="go(\'' + t + '\');dvhMore(false)">' + t + '</button>';
      }).join('');
    }
  }

  function dvhMore(on) {
    var el = $('moresheet');
    if (el) el.classList.toggle('open', !!on);
  }

  /* ================================================================ SEASON */
  function finalGames() {
    return s.games.filter(function (g) { return g.teamId === s.team && g.status === 'final'; })
      .slice().sort(function (a, b) { return String(a.date || '').localeCompare(String(b.date || '')); });
  }

  function recOf(g) { var d = dvhTotal(g), o = g.oppScore || 0; return d > o ? 'W' : d < o ? 'L' : 'T'; }
  function venueOf(g) { return s.venue[g.id] || ''; }

  function seasonSetVenue(gid, v) { s.venue[gid] = v; persist(); render(); }
  function seasonScout(gid, v) { s.scout[gid] = v; persist(); }

  function seasonAttendance() {
    var t = team(), out = {};
    t.players.forEach(function (pl) { out[pl.id] = { name: pl.name, p: 0, l: 0, a: 0, e: 0 }; });
    s.history.filter(function (x) { return x.team === s.team; }).forEach(function (x) {
      var at = x.attendance || {};
      Object.keys(at).forEach(function (pid) {
        if (!out[pid]) return;
        var v = at[pid];
        if (v === 'Present') out[pid].p++;
        else if (v === 'Late') out[pid].l++;
        else if (v === 'Absent') out[pid].a++;
        else if (v === 'Excused') out[pid].e++;
      });
    });
    return out;
  }

  function seasonHTML() {
    var t = team(), fin = finalGames(), live = s.games.filter(function (g) { return g.teamId === s.team && g.status !== 'final'; });
    var w = 0, l = 0, ti = 0, pf = 0, pa = 0, hw = 0, hl = 0, aw = 0, al = 0;
    fin.forEach(function (g) {
      var d = dvhTotal(g), o = g.oppScore || 0; pf += d; pa += o;
      var r = recOf(g);
      if (r === 'W') w++; else if (r === 'L') l++; else ti++;
      var v = venueOf(g);
      if (v === 'H') { if (r === 'W') hw++; else if (r === 'L') hl++; }
      if (v === 'A') { if (r === 'W') aw++; else if (r === 'L') al++; }
    });
    var streak = '', sn = 0;
    for (var i = fin.length - 1; i >= 0; i--) {
      var r = recOf(fin[i]);
      if (!sn) { streak = r; sn = 1; } else if (r === streak) sn++; else break;
    }
    var games = fin.length;
    var ppg = games ? (pf / games).toFixed(1) : '—';
    var oppg = games ? (pa / games).toFixed(1) : '—';
    var diff = games ? ((pf - pa) / games).toFixed(1) : '—';

    var out = '<div class="card"><h2>Season — ' + esc(t.name) + '</h2>' +
      '<div class="grid">' +
      '<div class="stat"><b>' + w + '–' + l + (ti ? '–' + ti : '') + '</b>Record</div>' +
      '<div class="stat"><b>' + (games ? Math.round(w / games * 100) + '%' : '—') + '</b>Win rate</div>' +
      '<div class="stat"><b>' + (streak ? sn + ' ' + streak : '—') + '</b>Current streak</div>' +
      '<div class="stat"><b>' + ppg + '</b>Points for / game</div>' +
      '<div class="stat"><b>' + oppg + '</b>Points against / game</div>' +
      '<div class="stat"><b>' + (diff > 0 ? '+' : '') + diff + '</b>Average margin</div>' +
      '</div>' +
      '<p class="muted">Home ' + hw + '–' + hl + ' · Away ' + aw + '–' + al + ' · ' + games + ' finalized game' + (games === 1 ? '' : 's') +
      (live.length ? ' · ' + live.length + ' in progress' : '') + '</p>' +
      (games || live.length ? '' : '<p class="muted">Add games in the Games tab, finalize them, and the season builds itself here.</p>') +
      '</div>';

    /* schedule */
    var all = s.games.filter(function (g) { return g.teamId === s.team; })
      .slice().sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
    if (all.length) {
      out += '<div class="card"><h2>Schedule and results</h2><div style="overflow:auto"><table class="tbl">' +
        '<tr><th>Date</th><th>Opponent</th><th>Site</th><th class="num">Score</th><th></th></tr>' +
        all.map(function (g) {
          var d = dvhTotal(g), o = g.oppScore || 0, r = recOf(g);
          var res = g.status === 'final'
            ? '<span class="pill ' + r.toLowerCase() + '">' + r + '</span>'
            : '<span class="muted">live</span>';
          var ven = '<select onchange="dvhSeasonVenue(\'' + g.id + '\',this.value)">' +
            [['', '—'], ['H', 'Home'], ['A', 'Away'], ['N', 'Neutral']].map(function (p) {
              return '<option value="' + p[0] + '"' + (venueOf(g) === p[0] ? ' selected' : '') + '>' + p[1] + '</option>';
            }).join('') + '</select>';
          return '<tr><td>' + esc(g.date || '—') + '</td><td><b>' + esc(g.opponent || 'Opponent') + '</b>' +
            (s.scout[g.id] ? '<div class="muted" style="font-size:12px">' + esc(s.scout[g.id]).slice(0, 70) + '</div>' : '') +
            '</td><td>' + ven + '</td><td class="num">' + d + '–' + o + '</td><td>' + res + '</td></tr>';
        }).join('') + '</table></div></div>';

      out += '<div class="card"><h2>Opponent scouting notes</h2>' +
        all.slice(0, 8).map(function (g) {
          return '<div class="drill"><b>' + esc((g.date || '') + ' · ' + (g.opponent || 'Opponent')) + '</b>' +
            '<textarea onchange="dvhSeasonScout(\'' + g.id + '\',this.value)" placeholder="Tendencies, key players, how we attack them">' + esc(s.scout[g.id] || '') + '</textarea></div>';
        }).join('') + '</div>';
    }

    /* attendance */
    var att = seasonAttendance(), thr = st().attThreshold;
    var rows = t.players.map(function (pl) {
      var a = att[pl.id] || { p: 0, l: 0, a: 0, e: 0 };
      var marked = a.p + a.l + a.a;
      var pct = marked ? Math.round((a.p + a.l) / marked * 100) : null;
      return { name: pl.name, a: a, marked: marked, pct: pct };
    });
    if (rows.length) {
      out += '<div class="card"><h2>Season attendance</h2>' +
        '<p class="muted">Late counts as attended. Excused absences are left out of the percentage. Flag threshold: ' + thr + '%</p>' +
        '<div class="row"><label class="grow">Flag under (%)</label><input type="number" min="0" max="100" value="' + thr + '" onchange="dvhSetAttThreshold(this.value)"></div>' +
        '<div style="overflow:auto"><table class="tbl"><tr><th>Player</th><th class="num">Present</th><th class="num">Late</th><th class="num">Absent</th><th class="num">Excused</th><th class="num">%</th><th></th></tr>' +
        rows.map(function (r) {
          var flag = r.pct !== null && r.pct < thr;
          return '<tr><td>' + esc(r.name) + '</td><td class="num">' + r.a.p + '</td><td class="num">' + r.a.l + '</td><td class="num">' + r.a.a + '</td><td class="num">' + r.a.e + '</td>' +
            '<td class="num">' + (r.pct === null ? '—' : r.pct + '%') + '</td><td>' +
            (r.pct === null ? '' : (flag ? '<span class="flag">below ' + thr + '%</span>' : '<span class="ok">on track</span>')) + '</td></tr>';
        }).join('') + '</table></div></div>';
    }
    return out;
  }

  function setAttThreshold(v) { st().attThreshold = Math.max(0, Math.min(100, Number(v) || 0)); persist(); render(); }

  /* ============================================================== ROTATION */
  function rotGame() {
    var list = s.games.filter(function (g) { return g.teamId === s.team; });
    if (!list.length) return null;
    var g = list.filter(function (x) { return x.id === s.activeGame; })[0];
    return g || list[list.length - 1];
  }

  function rotState(gid) {
    if (!s.rotation[gid] || typeof s.rotation[gid] !== 'object') s.rotation[gid] = { secs: {}, targets: {} };
    var r = s.rotation[gid];
    if (!r.secs || typeof r.secs !== 'object') r.secs = {};
    if (!r.targets || typeof r.targets !== 'object') r.targets = {};
    return r;
  }

  function lineup(gid) {
    if (!Array.isArray(s.lineups[gid])) s.lineups[gid] = [];
    return s.lineups[gid];
  }

  function pmMap(gid) {
    if (!s.pm[gid] || typeof s.pm[gid] !== 'object') s.pm[gid] = {};
    return s.pm[gid];
  }

  function rotToggle(gid, pid) {
    var ln = lineup(gid), i = ln.indexOf(pid);
    if (i >= 0) ln.splice(i, 1); else if (ln.length < 5) ln.push(pid);
    persist(); render();
  }

  function rotClear(gid) { s.lineups[gid] = []; persist(); render(); }

  function rotTarget(gid, pid, v) {
    var r = rotState(gid);
    var n = Number(v);
    if (!isFinite(n) || n <= 0) delete r.targets[pid]; else r.targets[pid] = Math.round(n * 10) / 10;
    persist(); render();
  }

  function mins(sec) { return sec ? (sec / 60) : 0; }

  function rotationHTML() {
    var g = rotGame();
    if (!g) return '<div class="card"><h2>Rotation and minutes</h2><p class="muted">Add a game in the Games tab first, then plan the rotation here.</p>' + B("Go to Games", "go('Games')", 'gold') + '</div>';
    var t = team(), r = rotState(g.id), ln = lineup(g.id), pm = pmMap(g.id);
    var players = t.players;
    var total = 0, targetSum = 0;
    players.forEach(function (pl) { total += (r.secs[pl.id] || 0); targetSum += (r.targets[pl.id] || 0); });
    var gameMin = 32;
    var onCourt = ln.length;

    var out = '<div class="card"><h2>Rotation — vs ' + esc(g.opponent || 'Opponent') + ' · ' + esc(g.date || '') + '</h2>' +
      '<p class="muted">Tap a player to put them on the floor. While the game clock runs, on-court minutes accrue automatically and plus/minus is credited to whoever is on the floor when the score changes.</p>' +
      '<div class="row"><b class="grow">On the floor: ' + onCourt + ' / 5</b>' + B('Clear lineup', 'dvhRotClear(\'' + g.id + '\')', 'alt') + '</div>' +
      '<div class="chips">' + players.map(function (pl) {
        var on = ln.indexOf(pl.id) >= 0;
        return '<button class="chip' + (on ? ' on' : '') + '" onclick="dvhRotToggle(\'' + g.id + '\',\'' + pl.id + '\')">' + esc(pl.name) + '</button>';
      }).join('') + '</div>' +
      '<p class="muted">Planned minutes: <b>' + (Math.round(targetSum * 10) / 10) + '</b> of ' + (gameMin * 5) + ' available (' + gameMin + ' min × 5 spots).</p>' +
      (Math.abs(targetSum - gameMin * 5) > 0.05 && targetSum > 0 ? '<p class="flag">Target minutes do not add up to ' + (gameMin * 5) + '.</p>' : '') +
      '</div>';

    out += '<div class="card"><h2>Minutes and plus/minus</h2><div style="overflow:auto"><table class="tbl">' +
      '<tr><th>Player</th><th class="num">Target</th><th class="num">Played</th><th class="num">+/−</th><th></th></tr>' +
      players.map(function (pl) {
        var played = mins(r.secs[pl.id] || 0);
        var plus = pm[pl.id] || 0;
        var on = ln.indexOf(pl.id) >= 0;
        return '<tr><td>' + esc(pl.name) + (on ? ' <span class="tag">on floor</span>' : '') + '</td>' +
          '<td class="num"><input style="width:74px;padding:6px;text-align:right" type="number" step="1" min="0" value="' + (r.targets[pl.id] || '') + '" onchange="dvhRotTarget(\'' + g.id + '\',\'' + pl.id + '\',this.value)"></td>' +
          '<td class="num" id="pm-' + pl.id + '">' + played.toFixed(1) + '</td>' +
          '<td class="num">' + (plus > 0 ? '+' + plus : plus) + '</td>' +
          '<td>' + (on ? B('Off', 'dvhRotToggle(\'' + g.id + '\',\'' + pl.id + '\')', 'alt') : B('On', 'dvhRotToggle(\'' + g.id + '\',\'' + pl.id + '\')', '')) + '</td></tr>';
      }).join('') + '</table></div>' +
      '<p class="muted">Total floor minutes logged: <b id="rotTotal">' + (Math.round(total / 60 * 10) / 10) + '</b></p></div>';
    return out;
  }

  /* ============================================================== PLAYBOOK */
  var pbPlay = null, pbFrame = 0, pbTool = 'o', pbDrag = null, pbAnim = null;

  function pbFind(id) { return s.playbook.filter(function (p) { return p.id === id; })[0]; }

  function pbNew() {
    var p = { id: uid(), name: 'New play', frames: [{ items: [] }] };
    s.playbook.push(p); pbPlay = p.id; pbFrame = 0; persist(); render();
  }
  function pbOpen(id) { pbPlay = id; pbFrame = 0; persist(); render(); }
  function pbDelete(id) {
    if (!confirm('Delete this play?')) return;
    s.playbook = s.playbook.filter(function (p) { return p.id !== id; });
    if (pbPlay === id) pbPlay = null;
    persist(); render();
  }
  function pbDuplicate(id) {
    var p = pbFind(id); if (!p) return;
    var c = JSON.parse(JSON.stringify(p)); c.id = uid(); c.name = p.name + ' (copy)';
    s.playbook.push(c); pbPlay = c.id; pbFrame = 0; persist(); render();
  }
  function pbRename(id, v) { var p = pbFind(id); if (!p) return; p.name = v; persist(); }
  function pbToolSet(t) { pbTool = t; render(); }

  function pbCur() { var p = pbFind(pbPlay); if (!p) return null; if (!p.frames[pbFrame]) pbFrame = 0; return p; }

  function pbFrameAdd() {
    var p = pbCur(); if (!p) return;
    var src = p.frames[pbFrame] ? JSON.parse(JSON.stringify(p.frames[pbFrame].items)) : [];
    p.frames.push({ items: src });
    pbFrame = p.frames.length - 1; persist(); render();
  }
  function pbFrameDel() {
    var p = pbCur(); if (!p || p.frames.length < 2) return;
    p.frames.splice(pbFrame, 1); pbFrame = Math.max(0, pbFrame - 1); persist(); render();
  }
  function pbFrameGo(n) { var p = pbCur(); if (!p) return; pbFrame = Math.max(0, Math.min(p.frames.length - 1, n)); render(); }
  function pbUndo() { var p = pbCur(); if (!p || !p.frames[pbFrame]) return; p.frames[pbFrame].items.pop(); persist(); render(); }
  function pbClear() { var p = pbCur(); if (!p || !p.frames[pbFrame]) return; p.frames[pbFrame].items = []; persist(); render(); }

  function pbAnimate() {
    var p = pbCur(); if (!p) return;
    if (pbAnim) { clearInterval(pbAnim); pbAnim = null; render(); return; }
    pbFrame = 0; render();
    pbAnim = setInterval(function () {
      var pl = pbCur(); if (!pl) { clearInterval(pbAnim); pbAnim = null; return; }
      if (pbFrame >= pl.frames.length - 1) { clearInterval(pbAnim); pbAnim = null; render(); return; }
      pbFrame++; render();
    }, 900);
  }

  function pbPoint(ev, svg) {
    var r = svg.getBoundingClientRect();
    var x = (ev.clientX - r.left) / r.width * 500;
    var y = (ev.clientY - r.top) / r.height * 470;
    return { x: Math.max(4, Math.min(496, x)), y: Math.max(4, Math.min(466, y)) };
  }

  function pbDown(ev) {
    var p = pbCur(); if (!p) return;
    var svg = ev.currentTarget, pt = pbPoint(ev, svg);
    if (!p.frames[pbFrame]) p.frames[pbFrame] = { items: [] };
    if (pbTool === 'o' || pbTool === 'x' || pbTool === 'scr') {
      p.frames[pbFrame].items.push({ t: pbTool, x1: pt.x, y1: pt.y, x2: pt.x, y2: pt.y });
      persist(); render();
    } else {
      pbDrag = pt;
    }
  }

  function pbUp(ev) {
    if (!pbDrag) return;
    var p = pbCur(); if (!p) { pbDrag = null; return; }
    var pt = pbPoint(ev, ev.currentTarget);
    if (Math.abs(pt.x - pbDrag.x) + Math.abs(pt.y - pbDrag.y) > 8) {
      p.frames[pbFrame].items.push({ t: pbTool, x1: pbDrag.x, y1: pbDrag.y, x2: pt.x, y2: pt.y });
      persist(); render();
    }
    pbDrag = null;
  }

  function courtSVG(inner, opts) {
    opts = opts || {};
    return '<svg class="court" viewBox="0 0 500 470" ' + (opts.handlers || '') + '>' +
      '<rect x="2" y="2" width="496" height="466" fill="#f8f4ea" stroke="#d9cdb0" stroke-width="4"/>' +
      '<rect x="170" y="2" width="160" height="190" class="ln"/>' +
      '<circle cx="250" cy="192" r="60" class="ln"/>' +
      '<path d="M30 2 L30 140 A237.5 237.5 0 0 0 470 140 L470 2" class="ln"/>' +
      '<line x1="220" y1="40" x2="280" y2="40" class="back"/>' +
      '<circle cx="250" cy="52" r="9" class="hoop"/>' +
      (inner || '') + '</svg>';
  }

  function pbItemSVG(it) {
    if (it.t === 'o') return '<circle cx="' + it.x1 + '" cy="' + it.y1 + '" r="13" class="pdot"/>';
    if (it.t === 'x') return '<g class="xdot"><line x1="' + (it.x1 - 11) + '" y1="' + (it.y1 - 11) + '" x2="' + (it.x1 + 11) + '" y2="' + (it.y1 + 11) + '"/><line x1="' + (it.x1 + 11) + '" y1="' + (it.y1 - 11) + '" x2="' + (it.x1 - 11) + '" y2="' + (it.y1 + 11) + '"/></g>';
    if (it.t === 'scr') return '<line x1="' + (it.x1 - 16) + '" y1="' + it.y1 + '" x2="' + (it.x1 + 16) + '" y2="' + it.y1 + '" class="scr"/>';
    var cls = it.t === 'pas' ? 'pas' : 'arr';
    var mx = (it.x1 + it.x2) / 2, my = (it.y1 + it.y2) / 2;
    var ang = Math.atan2(it.y2 - it.y1, it.x2 - it.x1);
    var a1 = ang + 2.6, a2 = ang - 2.6;
    var head = '<path d="M' + it.x2 + ' ' + it.y2 + ' L' + (it.x2 + 14 * Math.cos(a1)) + ' ' + (it.y2 + 14 * Math.sin(a1)) +
      ' M' + it.x2 + ' ' + it.y2 + ' L' + (it.x2 + 14 * Math.cos(a2)) + ' ' + (it.y2 + 14 * Math.sin(a2)) + '" class="arr"/>';
    if (it.t === 'pas') return '<line x1="' + it.x1 + '" y1="' + it.y1 + '" x2="' + it.x2 + '" y2="' + it.y2 + '" class="pas"/>' + head;
    return '<line x1="' + it.x1 + '" y1="' + it.y1 + '" x2="' + it.x2 + '" y2="' + it.y2 + '" class="arr"/>' + head;
  }

  function playbookHTML() {
    var out = '';
    if (!s.playbook.length) {
      out += '<div class="card"><h2>Playbook</h2><p class="muted">Draw a play on the half court, save it, and step through it frame by frame at practice or in a timeout.</p>' + B('New play', 'dvhPbNew()', 'gold') + '</div>';
      return out;
    }
    out += '<div class="card"><h2>Playbook</h2><div class="row">' + B('New play', 'dvhPbNew()', 'gold') + '</div>' +
      s.playbook.map(function (p) {
        return '<div class="drill row"><span class="grow"><b>' + esc(p.name) + '</b><div class="muted">' + p.frames.length + ' frame' + (p.frames.length === 1 ? '' : 's') + '</div></span>' +
          B('Open', 'dvhPbOpen(\'' + p.id + '\')', pbPlay === p.id ? 'gold' : 'alt') +
          B('Copy', 'dvhPbDuplicate(\'' + p.id + '\')', 'alt') +
          B('Delete', 'dvhPbDelete(\'' + p.id + '\')', 'danger') + '</div>';
      }).join('') + '</div>';

    var p = pbFind(pbPlay);
    if (!p) { out += '<div class="card"><p class="muted">Open a play to edit it.</p></div>'; return out; }
    var items = (p.frames[pbFrame] && p.frames[pbFrame].items) || [];
    out += '<div class="card"><h2>' + esc(p.name) + ' — frame ' + (pbFrame + 1) + ' of ' + p.frames.length + '</h2>' +
      '<input class="wide" value="' + esc(p.name) + '" onchange="dvhPbRename(\'' + p.id + '\',this.value)">' +

    ensureAudio();

    if (scTimer.rem <= 0) scTimer.rem = st().shotClock;

  function scPaint() {
    var el = $('scClock');
    if (!el) { if (scInt) { clearInterval(scInt); scInt = null; } return; }
    var rem = scTimer.end ? Math.max(0, (scTimer.end - Date.now()) / 1000) : scTimer.rem;
    el.textContent = rem < 10 ? rem.toFixed(1) : String(Math.ceil(rem));
    el.classList.toggle('urgent', rem <= 5.05);
    if (scTimer.end && rem <= 0 && !scBeeped) {
      scBeeped = true;
      scTimer.end = null;
      scTimer.rem = 0;
      beepCycle();
      if (st().voice) say('Shot clock');

  function say(text) {

      var u = new SpeechSynthesisUtterance(text);

      window.speechSynthesis.cancel();

  }

  var voiceState = { key: '', said: {} };
  function voiceTick() {

    var key = a.id + ':' + a.index;
    if (voiceState.key !== key) voiceState = { key: key, said: {} };
    var marks = [300, 120, 60, 30, 10, 5, 4, 3, 2, 1];
    for (var i = 0; i < marks.length; i++) {
      var m = marks[i];
      if (r <= m && r > m - 2 && !voiceState.said[m]) {
        voiceState.said[m] = true;
        say(m >= 60 ? (Math.round(m / 60) + ' minute' + (m >= 120 ? 's' : '') + ' left') : m + ' seconds');

  function zoneOf(sh) {

      return 'Mid-range';

    if (Math.abs(dx) >= 218 && sh.y <= 140) return 'Corner 3';
    if (Math.abs(dx) < 120) return 'Top 3';
    return 'Wing 3';
  }

  /* ================================================================ SHARE */
  function b64url(bytes) {
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function unb64url(str) {
    var b = str.replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    var bin = atob(b), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function cat(a, b) { var o = new Uint8Array(a.length + b.length); o.set(a, 0); o.set(b, a.length); return o; }

  function encodePayload(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (typeof CompressionStream === 'undefined') return Promise.resolve(b64url(cat(new Uint8Array([0]), bytes)));
    try {
      var cs = new CompressionStream('deflate-raw');
      var w = cs.writable.getWriter();
      w.write(bytes); w.close();
      return new Response(cs.readable).arrayBuffer().then(function (buf) {
        return b64url(cat(new Uint8Array([1]), new Uint8Array(buf)));
      }).catch(function () { return b64url(cat(new Uint8Array([0]), bytes)); });
    } catch (e) { return Promise.resolve(b64url(cat(new Uint8Array([0]), bytes))); }
  }

  function decodePayload(code) {
    var raw = unb64url(code), flag = raw[0], body = raw.slice(1);
    if (flag === 1 && typeof DecompressionStream !== 'undefined') {
      try {
        var ds = new DecompressionStream('deflate-raw');
        var w = ds.writable.getWriter();
        w.write(body); w.close();
        return new Response(ds.readable).arrayBuffer().then(function (buf) {
          return JSON.parse(new TextDecoder().decode(buf));
        });
      } catch (e) { }
    }
    return Promise.resolve(JSON.parse(new TextDecoder().decode(body)));
  }

      var plan = {
        id: uid(), team: s.team, name: pl.name || 'Shared practice', date: pl.date || today(),
        startTime: pl.startTime || '17:30', location: pl.location || '', coach: pl.coach || '',
        focus: pl.focus || '', drills: [], notes: pl.notes || '', attendance: {}, ratings: {},
        teamEval: {}, score: [0, 0], index: 0, timer: { remaining: 0, end: null }
      };
      plan.drills = (pl.drills || []).map(function (d) {
        return { id: uid(), name: d.name, min: Number(d.min) || 0, notes: d.notes || '', done: false, links: d.links || [] };
      });
      plan.timer.remaining = (plan.drills[0] && plan.drills[0].min || 0) * 60;
      s.plans.push(plan); s.active = plan.id;
      persist(); shareDismiss(); go('Planner'); toast('Practice plan imported');
    } else {
      var html = reportViewHTML(obj);
      var el = $('reportview');
      if (el) el.remove();
      document.body.insertAdjacentHTML('beforeend',
        '<div id="reportview" style="position:fixed;inset:0;background:#f1f3f6;z-index:96;overflow:auto;padding:16px">' +
        '<div class="row"><b class="grow">Shared report</b><button class="alt" onclick="document.getElementById(\'reportview\').remove()">Close</button></div>' +
        html + '</div>');
    }
  }

  function reportViewHTML(o) {
    return '<div class="card"><h2>' + esc(o.name) + ' — development report</h2><p class="muted">' + esc(o.team || '') + ' · ' + esc(o.date || '') + '</p>' +
      '<div class="scorebox"><span class="muted" style="color:#e2c98c">OVERALL</span><div class="score">' + (o.overall != null ? o.overall.toFixed(2) + ' / 5' : '—') + '</div></div>' +
      '<div style="overflow:auto"><table class="tbl"><tr><th>Area</th><th class="num">Rating</th></tr>' +
      (o.groups || []).map(function (g) { return '<tr><td>' + esc(g.n) + '</td><td class="num">' + (g.v != null ? g.v.toFixed(2) : '—') + '</td></tr>'; }).join('') +
      '</table></div>' +
      ((o.tests || []).length ? '<h3>Testing</h3><div style="overflow:auto"><table class="tbl"><tr><th>Test</th><th>Result</th><th>Change</th></tr>' +
        o.tests.map(function (t) { return '<tr><td>' + esc(t.n) + '</td><td>' + esc(t.v) + '</td><td>' + esc(t.d) + '</td></tr>'; }).join('') + '</table></div>' : '') +
      ((o.mastery || []).length ? '<h3>Skill mastery</h3><p>' + esc(o.mastery.join(' · ')) + '</p>' : '') +
      (o.culture != null ? '<p><b>Culture rating:</b> ' + o.culture.toFixed(2) + ' / 5</p>' : '') +
      '</div>';
  }

  function shareDismiss() { var el = $('sharebar'); if (el) el.remove(); }

  function checkShare() {
    var m = /^#([pr])=(.+)$/.exec(location.hash || '');
    if (!m) return;
    decodePayload(m[2]).then(function (obj) {
      if (obj && obj.k) shareBanner(obj);
    }).catch(function () { toast('That shared link could not be read'); });
  }

  /* ================================================================ PRINT */
  function printArea(html) {
    var el = $('printarea');
    if (!el) { document.body.insertAdjacentHTML('beforeend', '<div id="printarea"></div>'); el = $('printarea'); }
    el.innerHTML = html;
    setTimeout(function () { window.print(); }, 60);
  }

  function printPlan() {
    var a = p(), times = planTimes(a), t = team();
    var html = '<h1>' + esc(t.name) + ' — ' + esc(a.name) + '</h1>' +
      '<p>' + esc(a.date) + ' · ' + esc(a.startTime || '') + (a.location ? ' · ' + esc(a.location) : '') + (a.coach ? ' · Coach ' + esc(a.coach) : '') + '</p>' +
      (a.focus ? '<p><b>Objectives:</b> ' + esc(a.focus) + '</p>' : '') +
      '<h2>Practice plan (' + a.drills.reduce(function (n, x) { return n + x.min; }, 0) + ' min)</h2>' +
      '<table class="tbl"><tr><th>Time</th><th>Drill</th><th class="num">Min</th><th>Setup / cues</th></tr>' +
      a.drills.map(function (d, i) {
        return '<tr><td>' + esc(times[i]) + '</td><td><b>' + esc(d.name) + '</b></td><td class="num">' + d.min + '</td><td>' + esc(d.notes || '') + '</td></tr>';
      }).join('') + '</table>' +
      (a.notes ? '<h2>Notes</h2><p>' + esc(a.notes) + '</p>' : '') +
      '<p class="muted">DVH Coaching OS · printed ' + new Date().toLocaleString() + '</p>';
    printArea(html);
  }

  function printReport(pid) {
    var f = devPlayer(pid); if (!f) { toast('Pick a player first'); return; }
    printArea('<h1>' + esc(f.team.name) + ' — ' + esc(f.pl.name) + '</h1>' + devReportHTML(pid));
  }

  /* =============================================================== BACKUP */
  var SNAP_KEY = 'dvh-os-snaps';

  function snaps() { try { return JSON.parse(localStorage.getItem(SNAP_KEY)) || []; } catch (e) { return []; } }

  function snapshot(label) {
    try {
      if (!st().snap) return;
      var data = JSON.stringify(s);
      if (data.length > 1400000) return;
      var list = snaps();
      list.unshift({ ts: Date.now(), label: label || 'Manual', data: data });
      while (list.length > 3) list.pop();
      localStorage.setItem(SNAP_KEY, JSON.stringify(list));
    } catch (e) { }
  }

  function snapshotNow() { st().snap = true; snapshot('Manual'); persist(); render(); toast('Snapshot saved'); }

  function snapRestore(ts) {
    var list = snaps(), one = list.filter(function (x) { return x.ts === ts; })[0];
    if (!one) return;
    if (!confirm('Restore the snapshot from ' + new Date(one.ts).toLocaleString() + '? Current records are replaced.')) return;
    try {
      var data = JSON.parse(one.data);
      s = data;
      migrate(); persist(); render(); toast('Snapshot restored');
    } catch (e) { toast('Snapshot could not be restored'); }
  }

  function snapDelete(ts) {
    localStorage.setItem(SNAP_KEY, JSON.stringify(snaps().filter(function (x) { return x.ts !== ts; })));
    render();
  }

  function snapDownload(ts) {
    var one = snaps().filter(function (x) { return x.ts === ts; })[0];
    if (!one) return;
    download('DVH-snapshot-' + new Date(one.ts).toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.json', one.data, 'application/json');
  }

  function usage() {
    var bytes = 0;
    try { bytes = new Blob([JSON.stringify(s)]).size; } catch (e) { }
    var pct = Math.min(100, Math.round(bytes / (5 * 1024 * 1024) * 100));
    return { bytes: bytes, pct: pct };
  }

  function setSetting(k, v) { st()[k] = v; persist(); render(); }

  /* ============================================================ tab render */
  function backupExtra() {
    var u = usage(), cls = u.pct > 80 ? 'bad' : u.pct > 55 ? 'warn' : '';
    var list = snaps();
    return '<div class="card"><h2>Automatic snapshots</h2>' +
      '<p class="muted">Every saved session also writes a local snapshot you can roll back to. The last three are kept on this device.</p>' +
      '<div class="meter"><i class="' + cls + '" style="width:' + u.pct + '%"></i></div>' +
      '<p class="muted">' + (u.bytes / 1024).toFixed(0) + ' KB used (' + u.pct + '% of a typical 5 MB browser allowance)</p>' +
      '<label style="display:flex;align-items:center;gap:8px;margin:10px 0"><input type="checkbox" ' + (st().autoExport ? 'checked' : '') + ' onchange="dvhSet(\'autoExport\',this.checked)"> Auto-download a JSON backup every time I save a session</label>' +
      '<div class="row">' + B('Snapshot now', 'dvhSnapNow()', 'gold') + B('Download current backup', 'exportData()', 'alt') + '</div>' +
      (list.length ? list.map(function (x) {
        return '<div class="drill row"><span class="grow"><b>' + new Date(x.ts).toLocaleString() + '</b><div class="muted">' + esc(x.label) + ' · ' + Math.round(x.data.length / 1024) + ' KB</div></span>' +
          B('Restore', 'dvhSnapRestore(' + x.ts + ')', '') + B('Download', 'dvhSnapDownload(' + x.ts + ')', 'alt') + B('✕', 'dvhSnapDelete(' + x.ts + ')', 'danger') + '</div>';
      }).join('') : '<p class="muted">No snapshots yet.</p>') + '</div>' +
      '<div class="card"><h2>Move to another device</h2>' +
      '<p class="muted">There is no account and no server, so a device move is a file move. Export here, get the file onto the other phone or laptop (AirDrop, email to yourself, iCloud or Google Drive), then use Restore backup above.</p>' +
      '<div class="row">' + B('Export backup file', 'exportData()', 'gold') + B('Import a backup file', 'dvhGoBackupTop()', 'alt') + '</div>' +
      '<p class="muted">Single practices and player reports travel lighter: use Copy share link on Planner or Development and send the link itself.</p></div>';
  }

  function liveExtra() {
    return '<div class="card"><h2>Gym display and voice</h2>' +
      '<div class="row">' + B('Open big display', 'dvhBigOpen()', 'gold') + '</div>' +
      '<label style="display:flex;align-items:center;gap:8px;margin-top:10px"><input type="checkbox" ' + (st().voice ? 'checked' : '') + ' onchange="dvhSet(\'voice\',this.checked)"> Voice countdown (1 minute, 30, 10, then the last 5 seconds)</label>' +
      '<p class="muted">The big display shows the drill name, a countdown you can read from the bleachers, and what comes next.</p></div>';
  }

  function plannerExtra() {
    return '<div class="card"><h2>Share and print</h2>' +
      '<div class="row">' + B('Copy share link', 'dvhSharePlan()', 'gold') + B('Print one-page plan', 'dvhPrintPlan()', 'alt') + '</div>' +
      '<p class="muted">The share link carries the whole practice inside the URL. Send it to an assistant and they can add it to their own copy of the app.</p></div>';
  }

  function scoreboardExtra() {
    var opts = [24, 30, 35, 45].map(function (n) {
      return '<option value="' + n + '"' + (st().shotClock === n ? ' selected' : '') + '>' + n + 's</option>';
    }).join('');
    return '<div class="card"><h2>Shot clock</h2>' +
      '<div class="clock" id="scClock" style="font-size:64px">' + (st().shotClock) + '</div>' +
      '<div class="row">' + B('Start / Stop', 'dvhScStart()', 'gold') + B('Reset', 'dvhScReset()', 'alt') +
      '<select onchange="dvhShotClockSet(this.value)">' + opts + '</select></div></div>' +
      '<div class="card"><h2>Gym display</h2><div class="row">' + B('Open big display', 'dvhBigOpen()', 'gold') + '</div></div>';
  }

  function gamesExtra() {
    var g = shotGame(), out = '';
    if (g) out += shotChartCard(g.id);
    else out += '<div class="card"><h2>Shot chart</h2><p class="muted">Open a game above to log shots.</p></div>';
    out += compareHTML();
    if (!finalGames().length) out += '<div class="card"><h2>Season data</h2><p class="muted">Finalize a game to unlock season totals, the CSV export and the opponent comparison.</p><div class="row">' + B('Download season CSV', 'dvhExportCSV()', 'alt') + '</div></div>';
    return out;
  }

  function devExtra() {
    var pid = devPid;
    if (!pid) return '';
    return '<div class="card"><h2>Share this report</h2><div class="row">' +
      B('Copy parent/player link', 'dvhShareReport(\'' + pid + '\')', 'gold') +
      B('Print report', 'dvhPrintReport(\'' + pid + '\')', 'alt') + '</div>' +
      '<p class="muted">The link opens a read-only summary: area ratings, test results and mastery. No roster data leaves the device unless you send the link.</p></div>';
  }

  /* ------------------------------------------------------------ afterRender */
  function afterRender() {
    renderChrome();
    var main = $('main');
    if (!main) return;
    if (tab === 'Season') main.innerHTML = seasonHTML();
    else if (tab === 'Rotation') main.innerHTML = rotationHTML();
    else if (tab === 'Playbook') main.innerHTML = playbookHTML();
    else if (tab === 'Library') main.innerHTML = libraryHTML();
    else if (tab === 'Live') main.insertAdjacentHTML('beforeend', liveExtra());
    else if (tab === 'Planner') main.insertAdjacentHTML('beforeend', plannerExtra());
    else if (tab === 'Scoreboard') main.insertAdjacentHTML('beforeend', scoreboardExtra());
    else if (tab === 'Games') main.insertAdjacentHTML('beforeend', gamesExtra());
    else if (tab === 'Development') main.insertAdjacentHTML('beforeend', devExtra());
    else if (tab === 'Backup') main.insertAdjacentHTML('beforeend', backupExtra());
    scPaint();
  }

  /* ================================================================ HOOKS */
  function hook() {
    var base = render;
    render = function () {
      // keep every player record complete: 1.9.4 added bare {id,name} players,
      // which left the Development lab without profile fields or milestones.
      try { normPlayers(); } catch (e) { }
      try { base(); } catch (e) {
        console.error('dvh core render', e);
        var m = document.getElementById('main');
        if (m) m.innerHTML = '<div class="card"><h2>Something in these records could not be drawn</h2><p class="muted">Your data is still saved. Try Backup, then export a JSON copy before making changes.</p><pre style="white-space:pre-wrap;font-size:12px">' + String(e && e.message || e) + '</pre></div>';
      }
      try { afterRender(); } catch (e) { console.error('dvh addon', e); }
    };

    var baseTick = tick;
    tick = function () {
      baseTick();
      try { if (st().voice) voiceTick(); } catch (e) { }
    };

    var baseGstat = gstat;
    gstat = function (gid, pid, k, d) {
      var g = s.games.filter(function (x) { return x.id === gid; })[0];
      var before = g ? dvhTotal(g) : 0;
      baseGstat(gid, pid, k, d);
      if (g && k === 'pts') {
        var delta = dvhTotal(g) - before;
        if (delta) pmAdd(gid, delta);
      }
    };

    var baseGopp = gopp;
    gopp = function (gid, d) {
      baseGopp(gid, d);
      if (Number(d) > 0) pmAdd(gid, -Number(d));
    };

    var baseAddPlayer = addPlayer;
    addPlayer = function () { baseAddPlayer(); try { normPlayers(); persist(); } catch (e) { } };

    var baseArchive = archive;
    archive = function () {
      baseArchive();
      try { snapshot('Session saved'); if (st().autoExport) exportData(); } catch (e) { }
    };
  }

  function pmAdd(gid, delta) {
    var ln = s.lineups[gid];
    if (!ln || !ln.length) return;
    var m = pmMap(gid);
    ln.forEach(function (pid) { m[pid] = (m[pid] || 0) + delta; });
    persist();
  }

  /* --------------------------------------------------- on-court clock accrual */
  var lastRem = {};

  function accrue() {
    s.games.forEach(function (g) {
      if (g.teamId !== s.team || g.status === 'final') return;
      var c = g.clock || {};
      if (!c.end) { lastRem[g.id] = null; return; }
      var rem = Math.max(0, (c.end - Date.now()) / 1000);
      var prev = lastRem[g.id];
      if (prev != null) {
        var d = prev - rem;
        if (d > 0 && d < 3) {
          var ln = s.lineups[g.id];
          if (ln && ln.length) {
            var r = rotState(g.id);
            ln.forEach(function (pid) { r.secs[pid] = (r.secs[pid] || 0) + d; });
            if (tab === 'Rotation') {
              ln.forEach(function (pid) {
                var cell = $('pm-' + pid);
                if (cell) cell.textContent = mins(r.secs[pid] || 0).toFixed(1);
              });
              var tot = $('rotTotal');
              if (tot) {
                var sum = 0;
                Object.keys(r.secs).forEach(function (k) { sum += r.secs[k]; });
                tot.textContent = (Math.round(sum / 60 * 10) / 10);
              }
            }
          }
        }
      }
      lastRem[g.id] = rem;
    });
  }

  /* ================================================================ EXPORT */
  var api = {
    dvhMore: dvhMore, dvhToast: toast,
    dvhSeasonVenue: seasonSetVenue, dvhSeasonScout: seasonScout, dvhSetAttThreshold: setAttThreshold,
    dvhRotToggle: rotToggle, dvhRotClear: rotClear, dvhRotTarget: rotTarget,
    dvhPbNew: pbNew, dvhPbOpen: pbOpen, dvhPbDelete: pbDelete, dvhPbDuplicate: pbDuplicate,
    dvhPbRename: pbRename, dvhPbTool: pbToolSet, dvhPbFrameAdd: pbFrameAdd, dvhPbFrameDel: pbFrameDel,
    dvhPbFrameGo: pbFrameGo, dvhPbUndo: pbUndo, dvhPbClear: pbClear, dvhPbAnimate: pbAnimate,
    dvhPbDown: pbDown, dvhPbUp: pbUp,
    dvhLibSearch: libSearch, dvhLibTag: libTagSet, dvhLibTagIdx: libTagIdx, dvhLibTags: libTags,
    dvhShotClockSet: shotClockSet, dvhScStart: scStart, dvhScReset: scReset,
    dvhShotPid: shotSetPid, dvhShotMake: shotSetMake, dvhShotAdd: shotAdd, dvhShotUndo: shotUndo, dvhShotClear: shotClear,
    dvhExportCSV: exportCSV,
    dvhBigOpen: bigOpen, dvhBigClose: bigClose,
    dvhSharePlan: sharePlan, dvhCopyLink: copyLink, dvhShareReport: shareReport, dvhShareImport: shareImport, dvhShareDismiss: shareDismiss,
    dvhPrintPlan: printPlan, dvhPrintReport: printReport,
    dvhSet: setSetting, dvhSnapNow: snapshotNow, dvhSnapRestore: snapRestore, dvhSnapDelete: snapDelete, dvhSnapDownload: snapDownload,
    dvhGoBackupTop: function () {
      var inp = document.querySelector('#main input[type=file]');
      if (inp) inp.click(); else window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  };
  for (var k in api) window[k] = api[k];

  /* ================================================================== BOOT */
  migrate();
  scTimer.rem = st().shotClock;
  if (tabs.indexOf('Season') < 0) tabs.splice(tabs.indexOf('Games') + 1, 0, 'Season', 'Rotation', 'Playbook');
  hook();
  ensureChrome();
  setInterval(accrue, 1000);
  setTimeout(checkShare, 400);
  setTimeout(function () { try { render(); } catch (e) { } }, 0);
})();

</script></body></html>
