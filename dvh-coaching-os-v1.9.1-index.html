function devGroupAvg(asmt,gname){if(!asmt||!asmt.groups)return null;let g=asmt.groups[gname];if(!g)return null;let v=Object.values(g).filter(n=>typeof n==="number"&&n>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function devGroupAvgs(asmt){let o={};DEV_GROUPS.forEach(g=>{o[g.name]=devGroupAvg(asmt,g.name)});return o}
function devOverall(asmt){let v=Object.values(devGroupAvgs(asmt)).filter(n=>n!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function devRecommended(pid){let a=devLatest(pid);if(!a)return [];let av=devGroupAvgs(a);return DEV_GROUPS.map(g=>({name:g.name,avg:av[g.name]})).filter(x=>x.avg!==null).sort((x,y)=>x.avg-y.avg).slice(0,3).map(x=>x.name)}
function devSessionCount(pid){let w=s.devWorkouts.filter(x=>x.playerId===pid&&x.status==="done").length;let t=s.devSessions.filter(x=>x.playerId===pid).length;return w+t}
function devSetProfile(pid,k,v){let f=devPlayer(pid);if(!f)return;f.pl[k]=v;save()}
function devAddMilestone(pid){let el=document.getElementById("devMile");if(!el||!el.value.trim())return;let f=devPlayer(pid);if(!f)return;f.pl.milestones.push(el.value.trim());save();render()}
function devRemoveMilestone(pid,i){let f=devPlayer(pid);if(!f)return;f.pl.milestones.splice(i,1);save();render()}
function devMovePlayer(pid,teamId){let from=devPlayer(pid);if(!from||from.team.id===teamId)return;let t=s.teams.find(x=>x.id===teamId);if(!t)return;from.team.players=from.team.players.filter(x=>x.id!==pid);t.players.push(from.pl);save();render()}
function devSetAssessDate(v){devAssessDate=v;render()}
function devAssessment(pid,date){let list=s.devAssessments[pid];if(!Array.isArray(list)){list=[];s.devAssessments[pid]=list}let a=list.find(x=>x.date===date);if(!a){a={id:uid(),date,groups:{}};list.push(a)}return a}
function devRate(pid,group,sub,v){let a=devAssessment(pid,devAssessDate);if(!a.groups[group])a.groups[group]={};v=Number(v);if(v>0)a.groups[group][sub]=v;else delete a.groups[group][sub];save();render()}
function devAcceptPriorities(pid){s.devPriorities[pid]=devRecommended(pid).slice();save();render()}
function devSetPriority(pid,i,v){let cur=Array.isArray(s.devPriorities[pid])?s.devPriorities[pid].slice():devRecommended(pid).slice();while(cur.length<3)cur.push("");cur[i]=v;if(!v)cur.splice(i,1);s.devPriorities[pid]=cur;save();render()}
function devTestDef(key){return DEV_TESTS.find(t=>t.key===key)}
function devTestList(pid){let a=s.devTests[pid];if(!Array.isArray(a))a=[];return a.slice().sort((x,y)=>String(x.date||"").localeCompare(String(y.date||"")))}
function devAddTest(pid){let keyEl=document.getElementById("devTestKey");let key=keyEl?keyEl.value:"";let def=devTestDef(key);if(!def)return;let g=id=>{let el=document.getElementById(id);return el?el.value:""};let e={id:uid(),date:g("devTestDate")||today(),test:key};if(def.kind==="makes"){e.makes=Math.max(0,Math.round(Number(g("devTestMakes"))||0));e.of=def.of}else if(def.kind==="count"){e.makes=Math.max(0,Math.round(Number(g("devTestMakes"))||0))}else if(def.kind==="makesAttempts"){e.makes=Math.max(0,Math.round(Number(g("devTestMakes"))||0));e.attempts=Math.max(0,Math.round(Number(g("devTestAttempts"))||0))}else if(def.kind==="timeErrors"){e.timeSec=Math.max(0,Number(g("devTestTime"))||0);e.errors=Math.max(0,Math.round(Number(g("devTestErrors"))||0))}else if(def.kind==="time"){e.timeSec=Math.max(0,Number(g("devTestTime"))||0)}else{e.value=Number(g("devTestValue"))||0}let list=s.devTests[pid];if(!Array.isArray(list)){list=[];s.devTests[pid]=list}list.push(e);save();render()}
function devDeleteTest(pid,id){let list=s.devTests[pid];if(!Array.isArray(list))return;s.devTests[pid]=list.filter(e=>e.id!==id);save();render()}
function devTestValue(e){let def=devTestDef(e.test);if(!def)return null;if(def.kind==="makes"||def.kind==="count")return e.makes;if(def.kind==="makesAttempts")return (e.attempts>0)?e.makes/e.attempts:null;if(def.kind==="time"||def.kind==="timeErrors")return e.timeSec;return e.value}
function devTestImprovement(pid,key){let rows=devTestList(pid).filter(e=>e.test===key);if(rows.length<2)return null;let def=devTestDef(key);let base=devTestValue(rows[0]),cur=devTestValue(rows[rows.length-1]);if(base===null||cur===null)return null;let delta=def.dir==="up"?cur-base:base-cur;return {base,cur,delta,better:delta>0,worse:delta<0,def}}
function devTestDisplay(e){let def=devTestDef(e.test);if(!def)return "—";if(def.kind==="makes")return e.makes+" / "+(e.of||def.of);if(def.kind==="count")return e.makes+" in 60s";if(def.kind==="makesAttempts")return e.makes+" / "+e.attempts+(e.attempts>0?" ("+Math.round(e.makes/e.attempts*100)+"%)":"");if(def.kind==="timeErrors")return e.timeSec+"s · "+e.errors+" errors";if(def.kind==="time")return e.timeSec+"s";return String(e.value)+" "+def.unit}

function devWorkoutAlloc(d){let f=d/60;let out={};let sum=0;Object.keys(DEV_WORKOUT_BASE).forEach(k=>{out[k]=Math.round(DEV_WORKOUT_BASE[k]*f);sum+=out[k]});out["Finishing"]+=d-sum;return out}
function devNewWorkout(pid){let durEl=document.getElementById("devWODuration");let focEl=document.getElementById("devWOFocus");let duration=durEl?Number(durEl.value)||60:60;let focus=focEl?focEl.value.trim():"";let alloc=devWorkoutAlloc(duration);let blocks=Object.keys(alloc).map(name=>({id:uid(),name,min:alloc[name],drill:"",notes:"",cues:"",links:[],reps:"",makes:0,attempts:0,target:20}));let w={id:uid(),playerId:pid,date:today(),duration,focus,source:"manual",status:"active",blocks,postEval:{effort:"",notes:"",rating:0}};s.devWorkouts.push(w);save();render();return w}

function devEditBlock(wid,bi,k,v){let w=devWorkout(wid);if(!w||!w.blocks[bi])return;let b=w.blocks[bi];if(k==="min"){b.min=Math.max(0,Math.round(Number(v)||0))}else b[k]=v;save()}
function devAddBlock(wid){let w=devWorkout(wid);if(!w)return;w.blocks.push({id:uid(),name:"New block",min:5,drill:"",notes:"",cues:"",links:[],reps:"",makes:0,attempts:0,target:20});save();render()}
function devRemoveBlock(wid,bi){let w=devWorkout(wid);if(!w)return;w.blocks.splice(bi,1);save();render()}
function devAddBlockLink(wid,bi){let w=devWorkout(wid);if(!w||!w.blocks[bi])return;if(!Array.isArray(w.blocks[bi].links))w.blocks[bi].links=[];w.blocks[bi].links.push({label:"",url:""});save();render()}
function devEditBlockLink(wid,bi,j,k,v){let w=devWorkout(wid);if(!w||!w.blocks[bi]||!w.blocks[bi].links[j])return;w.blocks[bi].links[j][k]=v;save()}
function devRemoveBlockLink(wid,bi,j){let w=devWorkout(wid);if(!w||!w.blocks[bi])return;w.blocks[bi].links.splice(j,1);save();render()}
function devSetBlockDrill(wid,bi,libIdx){let w=devWorkout(wid);if(!w||!w.blocks[bi])return;let d=s.library[Number(libIdx)];if(!d)return;w.blocks[bi].drill=d.name;w.blocks[bi].notes=d.notes||"";save();render()}
function devCompleteWorkout(wid){let w=devWorkout(wid);if(!w)return;w.status="done";save();render()}
function devDeleteWorkout(wid){if(!confirm("Delete this workout?"))return;s.devWorkouts=s.devWorkouts.filter(x=>x.id!==wid);save();render()}
function devSetPostEval(wid,k,v){let w=devWorkout(wid);if(!w)return;if(!w.postEval)w.postEval={effort:"",notes:"",rating:0};w.postEval[k]=k==="rating"?Number(v):v;save()}
function devGeneratePlan(pid){let pri=devRecommended(pid);if(!pri.length)pri=["Ball handling","Finishing","Shooting"];let alloc=devWorkoutAlloc(60);let blocks=Object.keys(alloc).map(name=>{let b={id:uid(),name,min:alloc[name],drill:"",notes:"",cues:"",links:[],reps:"",makes:0,attempts:0,target:20};if(name==="Finishing"&&pri[0])b.drill=(DEV_GROUP_DRILLS[pri[0]]||[""])[0];if(name==="Secondary skill development"&&pri[1])b.drill=(DEV_GROUP_DRILLS[pri[1]]||[""])[0];if(name==="Ball handling")b.drill="Ball handling";return b});let w={id:uid(),playerId:pid,date:today(),duration:60,focus:"Generated plan — priorities: "+pri.join(", "),source:"generated",status:"draft",blocks,postEval:{effort:"",notes:"",rating:0}};s.devWorkouts.push(w);save();render();return w}
function devAcceptPlan(wid){let w=devWorkout(wid);if(!w)return;w.status="active";save();render()}
function devTrack(wid,bi,action){let w=devWorkout(wid);if(!w||!w.blocks[bi])return;let b=w.blocks[bi];if(action==="make"){b.makes++;b.attempts++}else if(action==="miss"){b.attempts++}else if(action==="undoMake"){if(b.makes>0){b.makes--;b.attempts--}}else if(action==="undoMiss"){if(b.attempts>b.makes)b.attempts--}else if(action==="reset"){b.makes=0;b.attempts=0}save();render()}
function devSetTarget(wid,bi,v){let w=devWorkout(wid);if(!w||!w.blocks[bi])return;w.blocks[bi].target=Number(v)||0;save();render()}
function devTrackerPct(b){return b.attempts>0?Math.round(b.makes/b.attempts*100):0}
function devCopyResults(wid,bi){let w=devWorkout(wid);if(!w||!w.blocks[bi])return "";let b=w.blocks[bi];let txt=(b.name||"Drill")+" — "+b.makes+"/"+b.attempts+" makes ("+devTrackerPct(b)+"%)";devLastCopied=txt;try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt)}catch(e){}return txt}
function devSaveSession(wid,bi){let w=devWorkout(wid);if(!w||!w.blocks[bi])return;let b=w.blocks[bi];s.devSessions.push({id:uid(),playerId:w.playerId,workoutId:wid,date:today(),drill:b.drill||b.name,makes:b.makes,misses:Math.max(0,b.attempts-b.makes),target:b.target||0});save();render()}

function devTimerPause(){if(devTimer.end){devTimer.remaining=Math.max(0,Math.ceil((devTimer.end-Date.now())/1000));devTimer.end=null}render()}
function devTimerReset(){devTimer={wid:null,bi:-1,remaining:0,end:null};render()}
function devTick(){let el=document.getElementById("devclock");if(!el)return;let r=devTimer.end?Math.max(0,Math.ceil((devTimer.end-Date.now())/1000)):devTimer.remaining;if(devTimer.end&&r===0){devTimer.end=null;devTimer.remaining=0}el.textContent=String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0")}

function devCultureEntry(pid,date){let list=s.devCulture[pid];if(!Array.isArray(list)){list=[];s.devCulture[pid]=list}let e=list.find(x=>x.date===date);if(!e){e={id:uid(),date,ratings:{}};list.push(e)}return e}

function devImpText(imp){if(!imp)return "—";let d=imp.delta;let fmt=(imp.def.kind==="makesAttempts")?(Math.round(d*1000)/10)+" pts":String(Math.round(d*100)/100);if(d>0)return "+"+fmt+" — improving";if(d<0)return fmt+" — regressing";return "No change"}
function devReportHTML(pid){
 let f=devPlayer(pid);if(!f)return "";
 let pl=f.pl;
 let cutoff=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
 let latest=devLatest(pid),prev=devPrev(pid);
 let ov=latest?devOverall(latest):null;
 let av=latest?devGroupAvgs(latest):{};
 let pav=prev?devGroupAvgs(prev):{};
 let improved=[],regressed=[];
 DEV_GROUPS.forEach(g=>{let a=av[g.name],b=pav[g.name];if(a!=null&&b!=null){if(a>b+0.09)improved.push(g.name+" ("+b.toFixed(1)+" → "+a.toFixed(1)+")");else if(a<b-0.09)regressed.push(g.name+" ("+b.toFixed(1)+" → "+a.toFixed(1)+")")}});
 let testLines=[];
 DEV_TESTS.forEach(t=>{let imp=devTestImprovement(pid,t.key);if(imp){let line=t.name+": "+devTestDisplay(devTestList(pid).filter(e=>e.test===t.key)[0])+" → "+devTestDisplay(devTestList(pid).filter(e=>e.test===t.key).slice(-1)[0])+" ("+devImpText(imp)+")";if(imp.better)testLines.push({t:line,good:true});else if(imp.worse)testLines.push({t:line,good:false})}});
 let sess30=s.devSessions.filter(x=>x.playerId===pid&&String(x.date||"")>=cutoff).length+s.devWorkouts.filter(x=>x.playerId===pid&&x.status==="done"&&String(x.date||"")>=cutoff).length;
 let hw=s.devHomework.filter(x=>x.playerId===pid);
 let hwDone=hw.filter(x=>x.done).length;
 let cult=devCultureList(pid);let cultLatest=cult.length?cult[cult.length-1]:null;
 let m=devMasteryMap(pid);
 let mastered=Object.keys(m).filter(k=>m[k]===5);
 let developing=Object.keys(m).filter(k=>m[k]>0&&m[k]<5);
 let rows=DEV_GROUPS.map(g=>`<tr><td>${esc(g.name)}</td><td class="num">${av[g.name]!=null?av[g.name].toFixed(2):"—"}</td><td class="num">${pav[g.name]!=null?pav[g.name].toFixed(2):"—"}</td></tr>`).join("");
 return `<div class="card"><h2>Development report card — ${esc(pl.name)}</h2><p class="muted">Last 30 days · ${esc(f.team.name)} · Parent-friendly summary. Print from the Backup tab or your browser.</p><div class="grid"><div class="stat"><span class="muted">Overall development rating</span><b>${ov!==null?ov.toFixed(2)+" / 5":"—"}</b></div><div class="stat"><span class="muted">Training sessions (30 days)</span><b>${sess30}</b></div><div class="stat"><span class="muted">Assignments completed</span><b>${hwDone} / ${hw.length}</b></div><div class="stat"><span class="muted">Culture rating</span><b>${cultLatest?(()=>{let v=Object.values(cultLatest.ratings).filter(n=>typeof n==="number"&&n>0);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2)+" / 5":"—"})():"—"}</b></div></div><h3 style="margin:12px 0 4px">Skill averages</h3><div style="overflow:auto"><table class="tbl"><tr><th>Skill group</th><th class="num">Current</th><th class="num">Previous</th></tr>${rows}</table></div><h3 style="margin:12px 0 4px">Performance testing — baseline vs current</h3>${testLines.length?testLines.map(x=>`<p>${x.good?"▲":"▼"} ${esc(x.t)}</p>`).join(""):'<p class="muted">No repeated tests yet — record the same test twice to see progress.</p>'}<h3 style="margin:12px 0 4px">Areas of improvement</h3>${improved.length?improved.map(x=>`<p>▲ ${esc(x)}</p>`).join(""):'<p class="muted">No measured improvement yet.</p>'}<h3 style="margin:12px 0 4px">Areas of regression</h3>${regressed.length?regressed.map(x=>`<p>▼ ${esc(x)}</p>`).join(""):'<p class="muted">No measured regression.</p>'}<h3 style="margin:12px 0 4px">Culture ratings</h3>${cultLatest?DEV_CULTURE.map(c=>`<p>${esc(c.n)}: <b>${cultLatest.ratings[c.n]||"—"}</b> <span class="muted">${esc(c.d)}</span></p>`).join(""):'<p class="muted">No culture ratings yet.</p>'}<h3 style="margin:12px 0 4px">Skills mastered</h3><p>${mastered.length?esc(mastered.join(", ")):"None yet."}</p><h3 style="margin:12px 0 4px">Skills still developing</h3><p>${developing.length?esc(developing.map(k=>k+" (Level "+m[k]+")").join(", ")):"None recorded yet."}</p><h3 style="margin:12px 0 4px">Coach observations</h3><p>${esc(pl.coachObservations||"—")}</p><h3 style="margin:12px 0 4px">Goals for the next 30 days</h3><p>${esc(pl.shortTermGoals||"—")}</p><p class="muted">Long-term goals: ${esc(pl.longTermGoals||"—")}</p></div>`;
}

 let prof=`<div class="card"><h2>Player profile — ${esc(pl.name)}</h2><p class="muted">This profile follows ${esc(pl.name)} even if they move teams. Positions are flexible, not permanent labels — a young post player still develops guard skills.</p><div class="devgrid">${field("Age",pl.age,"devSetProfile('"+pid+"','age',this.value)")}${field("Grade",pl.grade,"devSetProfile('"+pid+"','grade',this.value)")}${field("Height",pl.height,"devSetProfile('"+pid+"','height',this.value)")}${field("Primary position",pl.primaryPosition,"devSetProfile('"+pid+"','primaryPosition',this.value)")}${field("Secondary position",pl.secondaryPosition,"devSetProfile('"+pid+"','secondaryPosition',this.value)")}<label>Dominant hand</label><select class="wide" onchange="devSetProfile('${pid}','dominantHand',this.value)">${["","Left","Right","Both"].map(v=>`<option value="${v}" ${v===pl.dominantHand?"selected":""}>${v||"—"}</option>`).join("")}</select>${field("Basketball experience",pl.experience,"devSetProfile('"+pid+"','experience',this.value)")}</div>${area("Strengths",pl.strengths,"devSetProfile('"+pid+"','strengths',this.value)")}${area("Areas of improvement",pl.areasOfImprovement,"devSetProfile('"+pid+"','areasOfImprovement',this.value)")}${area("Short-term goals",pl.shortTermGoals,"devSetProfile('"+pid+"','shortTermGoals',this.value)")}${area("Long-term goals",pl.longTermGoals,"devSetProfile('"+pid+"','longTermGoals',this.value)")}${area("Coach observations",pl.coachObservations,"devSetProfile('"+pid+"','coachObservations',this.value)")}<label>Development milestones</label>${pl.milestones.map((m,i)=>`<div class="row"><span class="grow">• ${esc(m)}</span>${btn("Remove","devRemoveMilestone('"+pid+"',"+i+")","danger")}</div>`).join("")}<div class="row"><input id="devMile" placeholder="New milestone" class="grow">${btn("Add milestone","devAddMilestone('"+pid+"')","alt")}</div><label>Move to team</label><select class="wide" onchange="devMovePlayer('${pid}',this.value)"><option value="">— keep on ${esc(f.team.name)} —</option>${s.teams.filter(t=>t.id!==f.team.id).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></div>`;
 let dash=`<div class="card"><h2>Development dashboard — ${esc(pl.name)}</h2><div class="grid"><div class="stat"><span class="muted">Overall development rating</span><b>${ov!==null?ov.toFixed(2)+" / 5":"—"}</b></div><div class="stat"><span class="muted">Recent change</span><b>${change===null?"—":(change>=0?"+":"")+change.toFixed(2)}</b></div><div class="stat"><span class="muted">Training sessions</span><b>${sessions}</b></div><div class="stat"><span class="muted">Culture rating</span><b>${cultAvg!==null?cultAvg.toFixed(2)+" / 5":"—"}</b></div></div><p class="muted">Individual development averages — separate from team-practice evaluation averages. Team-practice average (History): <b>${ps?ps.hist.toFixed(2)+" / 5":"—"}</b> · Individual development average: <b>${ov!==null?ov.toFixed(2)+" / 5":"—"}</b></p><div style="overflow:auto"><table class="tbl"><tr><th>Skill group</th><th class="num">Rating</th><th class="num">Change</th><th>Priority</th></tr>${DEV_GROUPS.map(g=>{let a=av[g.name],b=pav[g.name];let ch=(a!=null&&b!=null)?a-b:null;let isPri=accepted?accepted.includes(g.name):rec.includes(g.name);return `<tr><td>${esc(g.name)}</td><td class="num">${a!=null?a.toFixed(2):"—"}</td><td class="num">${ch===null?"—":(ch>=0?"+":"")+ch.toFixed(2)}</td><td>${isPri?"★ Priority":""}</td></tr>`}).join("")}</table></div><h3 style="margin:12px 0 4px">Recommended training priorities</h3>${rec.length?`<p>${rec.map((r,i)=>(i+1)+". "+esc(r)).join(" · ")}</p>`:'<p class="muted">No assessment yet — rate the skill groups below and priorities will appear here.</p>'}${accepted?`<p><b>Accepted priorities:</b> ${esc(accepted.join(", ")||"—")}</p>`:""}<div class="row">${btn("Accept recommended priorities","devAcceptPriorities('"+pid+"')","gold")}<span class="muted">Or modify them:</span>${[0,1,2].map(i=>`<select onchange="devSetPriority('${pid}',${i},this.value)"><option value="">—</option>${DEV_GROUPS.map(g=>`<option ${((accepted||rec)[i]===g.name)?"selected":""}>${esc(g.name)}</option>`).join("")}</select>`).join("")}</div><div class="row" style="margin-top:8px">${btn("Generate development plan","devGeneratePlan('"+pid+"')","gold")}<span class="muted">Drafts a workout from the lowest groups and test results — you accept or modify it before it becomes active.</span></div></div>`;
 let curAsmt=devAssessList(pid).find(x=>x.date===devAssessDate)||null;
 let assess=`<div class="card"><h2>Skill assessment</h2><p class="muted">1 Needs instruction · 2 Developing · 3 Inconsistent · 4 Proficient · 5 Game-ready. Leave a sub-skill blank if it was not assessed — blanks never count as zero. Group average uses rated sub-skills only.</p><div class="row"><label>Assessment date</label><input type="date" value="${devAssessDate}" onchange="devSetAssessDate(this.value)"></div>${DEV_GROUPS.map(g=>{let ga=curAsmt?devGroupAvg(curAsmt,g.name):null;return `<details class="drill"><summary>${esc(g.name)} <span class="muted">${ga!==null?"avg "+ga.toFixed(2):"not rated"}</span></summary>${g.subs.map(sub=>{let v=curAsmt&&curAsmt.groups[g.name]?curAsmt.groups[g.name][sub]||0:0;return `<div class="row" style="margin:6px 0"><span class="grow">${esc(sub)}</span><select onchange="devRate('${pid}','${esc(g.name)}','${esc(sub)}',this.value)">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${n===v?"selected":""}>${n||"—"}</option>`).join("")}</select></div>`}).join("")}</details>`}).join("")}<p class="muted">${devAssessList(pid).length} assessment${devAssessList(pid).length===1?"":"s"} on file. Latest: ${latest?esc(latest.date):"—"}</p></div>`;
 let testRows=DEV_TESTS.map(t=>{let rows=devTestList(pid).filter(e=>e.test===t.key);let imp=devTestImprovement(pid,t.key);let first=rows.length?rows[0]:null,last=rows.length?rows[rows.length-1]:null;return `<tr><td>${esc(t.name)}</td><td class="num">${first?devTestDisplay(first):"—"}</td><td class="num">${last?devTestDisplay(last):"—"}</td><td>${devImpText(imp)}</td><td class="num">${rows.length}</td></tr>`}).join("");
 let testing=`<div class="card"><h2>Performance testing</h2><p class="muted">Objective results, not coach ratings. Record the same test twice to measure progress. Shooting makes and percentages, jump height and distance improve UP; sprint and agility times and dribbling errors improve DOWN. Tests are age-appropriate and run under consistent conditions.</p><div class="row"><label style="display:flex;flex-direction:column;gap:4px">Test<select id="devTestKey">${DEV_TESTS.map(t=>`<option value="${t.key}">${esc(t.name)}</option>`).join("")}</select></label><label style="display:flex;flex-direction:column;gap:4px">Date<input id="devTestDate" type="date" value="${today()}"></label><label style="display:flex;flex-direction:column;gap:4px">Makes<input id="devTestMakes" type="number" min="0" placeholder="makes"></label><label style="display:flex;flex-direction:column;gap:4px">Attempts<input id="devTestAttempts" type="number" min="0" placeholder="attempts"></label><label style="display:flex;flex-direction:column;gap:4px">Time (sec)<input id="devTestTime" type="number" min="0" step="0.01" placeholder="seconds"></label><label style="display:flex;flex-direction:column;gap:4px">Errors<input id="devTestErrors" type="number" min="0" placeholder="errors"></label><label style="display:flex;flex-direction:column;gap:4px">Value<input id="devTestValue" type="number" step="0.01" placeholder="height / distance"></label>${btn("Record test","devAddTest('"+pid+"')","gold")}</div><div style="overflow:auto"><table class="tbl"><tr><th>Test</th><th class="num">Baseline</th><th class="num">Current</th><th>Improvement</th><th class="num">Records</th></tr>${testRows}</table></div></div>`;
 let myWOs=s.devWorkouts.filter(x=>x.playerId===pid).slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
 let wo=`<div class="card"><h2>Individual training plan builder</h2><p class="muted">Workouts of 30, 45, 60 or 90 minutes. Blocks follow the DVH template — Athletic preparation, Ball handling, Finishing (primary focus), Secondary skill development, Game application, Pressure challenge, Cooldown and evaluation — scaled to the duration. Pick drills from the Library, add video links, track makes live.</p><div class="row"><label style="display:flex;flex-direction:column;gap:4px">Duration<select id="devWODuration">${[30,45,60,90].map(d=>`<option value="${d}" ${d===60?"selected":""}>${d} min</option>`).join("")}</select></label><label style="display:flex;flex-direction:column;gap:4px">Primary focus<input id="devWOFocus" placeholder="e.g. Finishing"></label>${btn("Create workout","devNewWorkout('"+pid+"')","gold")}</div>${myWOs.length?myWOs.map(w=>devWorkoutHTML(w)).join(""):'<p class="muted">No individual workouts yet for '+esc(pl.name)+'.</p>'}</div>`;
 let m=devMasteryMap(pid);
 let skillNames=Object.keys(m);DEV_MASTERY_SKILLS.forEach(sk=>{if(!(sk in m))skillNames.push(sk)});
 let mast=`<div class="card"><h2>Skill mastery — Brick by Brick, Built, Not Born</h2><p class="muted">Every skill moves through five levels. A player is not considered to have mastered a crossover just because they can do it around a cone — mastery takes live reads and game application.</p>${DEV_MASTERY_LEVELS.map(l=>`<p><b>${l.n}. ${l.name}</b> — ${l.d}</p>`).join("")}${skillNames.map(sk=>{let v=m[sk]||0;let lv=DEV_MASTERY_LEVELS.find(x=>x.n===v);return `<div class="row" style="margin:6px 0"><span class="grow"><b>${esc(sk)}</b>${lv?` <span class="muted">— ${lv.name}</span>`:""}</span><select onchange="devMasterySet('${pid}','${esc(sk)}',this.value)">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${n===v?"selected":""}>${n===0?"—":n+" "+DEV_MASTERY_LEVELS[n-1].name}</option>`).join("")}</select></div>`}).join("")}<div class="row"><input id="devNewSkill" placeholder="Add a skill (e.g. Crossover)" class="grow">${btn("Add skill","devAddMasterySkill('"+pid+"')","alt")}</div></div>`;
 let cultEntry=devCultureList(pid).find(x=>x.date===devCultureDate)||null;
 let cult=`<div class="card"><h2>Individual DAWG House culture rating</h2><p class="muted">Character and training habits — kept separate from basketball skill ratings and never mixed into skill averages. 1 Needs instruction · 2 Developing · 3 Inconsistent · 4 Proficient · 5 Game-ready.</p><div class="row"><label>Date</label><input type="date" value="${devCultureDate}" onchange="devSetCultureDate(this.value)"></div>${DEV_CULTURE.map(c=>{let v=cultEntry?cultEntry.ratings[c.n]||0:0;return `<div class="row" style="margin:6px 0"><div class="grow"><b>${esc(c.n)}</b><div class="muted">${esc(c.d)}</div></div><select onchange="devCultureRate('${pid}','${esc(c.n)}',this.value)">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${n===v?"selected":""}>${n||"—"}</option>`).join("")}</select></div>`}).join("")}<p class="muted">${devCultureList(pid).length} culture rating${devCultureList(pid).length===1?"":"s"} on file.</p></div>`;
 let hwList=s.devHomework.filter(x=>x.playerId===pid);
 let hwHtml=`<div class="card"><h2>At-home assignments — Homework Center</h2><p class="muted">Assign workouts to complete independently. Self-reported results are flagged "Self-reported" — they are not coach-verified performance testing. Parent confirmation is recorded where appropriate.</p><div class="row">${DEV_HOMEWORK_PRESETS.map((p,i)=>btn(esc(p.title)+" — "+p.target+" "+p.unit,"devAddHomework('"+pid+"',"+i+")","alt")).join("")}</div><div class="row"><input id="devHwTitle" placeholder="Custom assignment" class="grow"><input id="devHwTarget" type="number" min="0" placeholder="Target" style="width:90px"><input id="devHwUnit" placeholder="unit (min/makes)" style="width:130px">${btn("Add assignment","devAddHomework('"+pid+"')","gold")}</div>${hwList.length?hwList.map(hw=>`<div class="drill"><div class="row"><b class="grow">${esc(hw.title)} — ${hw.target} ${esc(hw.unit)} / day</b>${hw.done?(hw.selfReported?'<span class="flag">Self-reported</span>':'<span class="flag ok">Coach-verified</span>'):""}<span class="muted">${esc(hw.assigned||"")}</span></div><div class="row"><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" ${hw.done?"checked":""} onchange="devHwDone('${hw.id}',this.checked)"> Completed</label><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" ${hw.parentConfirmed?"checked":""} onchange="devHwSet('${hw.id}','parentConfirmed',this.checked)"> Parent confirmed</label>${hw.done&&hw.selfReported?btn("Mark coach-verified","devHwVerify('"+hw.id+"')","alt"):""}</div>${field("Player-reported result",hw.playerResult||"","devHwSet('"+hw.id+"','playerResult',this.value)")}${field("Due date",hw.due||"","devHwSet('"+hw.id+"','due',this.value)",'date')}${area("Coach feedback",hw.coachFeedback||"","devHwSet('"+hw.id+"','coachFeedback',this.value)")}${btn("Delete","devHwDelete('"+hw.id+"')","danger")}</div>`).join(""):'<p class="muted">No assignments yet for '+esc(pl.name)+'.</p>'}</div>`;
 return head+prof+dash+assess+testing+wo+mast+cult+hwHtml+devReportHTML(pid);
}
function devWorkoutHTML(w){
 let blocks=w.blocks.map((b,bi)=>{
  let libOpts=s.library.map((d,i)=>`<option value="${i}" ${d.name===b.drill?"selected":""}>${esc(d.name)}</option>`).join("");
  let isTimer=devTimer.wid===w.id&&devTimer.bi===bi;
  return `<div class="drill"><div class="row"><b class="grow">${esc(b.name)}</b><span class="muted">${b.min} min</span></div>${field("Block name",b.name,"devEditBlock('"+w.id+"',"+bi+",'name',this.value)")}${field("Minutes",b.min,"devEditBlock('"+w.id+"',"+bi+",'min',this.value)",'number')}<label>Drill (from Library)</label><select class="wide" onchange="devSetBlockDrill('${w.id}',${bi},this.value)"><option value="">— pick a drill —</option>${libOpts}</select>${area("Notes",b.notes,"devEditBlock('"+w.id+"',"+bi+",'notes',this.value)")}${field("Coaching cues",b.cues,"devEditBlock('"+w.id+"',"+bi+",'cues',this.value)")}${(b.links||[]).map((l,j)=>`${field("Link "+(j+1)+" label",l.label,"devEditBlockLink('"+w.id+"',"+bi+","+j+",'label',this.value)")}${field("Link "+(j+1)+" URL",l.url,"devEditBlockLink('"+w.id+"',"+bi+","+j+",'url',this.value)",'url')}${btn("Remove link","devRemoveBlockLink('"+w.id+"',"+bi+","+j+")","danger")}`).join("")}${btn("Add video link","devAddBlockLink('"+w.id+"',"+bi+")","alt")}${(b.links||[]).map(l=>`<a class="watch" href="${esc(l.url)}" target="_blank" rel="noopener">▶ Watch: ${esc(l.label||"Live example")}</a>`).join("")}<div class="row" style="margin-top:8px"><span class="muted">Live tracker</span><b>${b.makes}/${b.attempts} makes (${devTrackerPct(b)}%)</b><span class="muted">Target ${b.target||20} attempts</span></div><div class="row">${btn("Make","devTrack('"+w.id+"',"+bi+",'make')","gold")}${btn("Miss","devTrack('"+w.id+"',"+bi+",'miss')")}${btn("Undo make","devTrack('"+w.id+"',"+bi+",'undoMake')","alt")}${btn("Undo miss","devTrack('"+w.id+"',"+bi+",'undoMiss')","alt")}${btn("Reset drill","devTrack('"+w.id+"',"+bi+",'reset')","danger")}</div><div class="row"><label>Target attempts</label><select onchange="devSetTarget('${w.id}',${bi},this.value)">${[10,20,50,100].map(t=>`<option value="${t}" ${(b.target||20)===t?"selected":""}>${t}</option>`).join("")}</select>${btn("Copy training results","devCopyResults('"+w.id+"',"+bi+")","alt")}${btn("Save session","devSaveSession('"+w.id+"',"+bi+")","gold")}</div><div class="row"><span class="muted">Block timer</span>${isTimer?`<div class="clock" id="devclock" style="font-size:36px">--:--</div>${btn("Pause","devTimerPause()")}${btn("Reset","devTimerReset()","alt")}`:`${btn("Start block timer","devTimerStart('"+w.id+"',"+bi+")","gold")}`}</div><div class="row">${btn("Remove block","devRemoveBlock('"+w.id+"',"+bi+")","danger")}</div></div>`;
 }).join("");
 let draft=w.status==="draft"?`<p><b>Generated draft plan — review it, then accept it or edit it.</b></p>${btn("Accept plan","devAcceptPlan('"+w.id+"')","gold")}`:"";
 return `<details class="drill" ${w.status==="active"?"open":""}><summary>${esc(w.date)} · ${w.duration} min · ${esc(w.focus||"Individual workout")} <span class="muted">${w.source==="generated"?"generated draft":w.status}</span></summary>${draft}${field("Focus",w.focus,"devEditWorkout('"+w.id+"','focus',this.value)")}${field("Date",w.date,"devEditWorkout('"+w.id+"','date',this.value)",'date')}<p class="muted">${w.blocks.reduce((n,x)=>n+(x.min||0),0)} planned minutes</p>${blocks}${btn("Add block","devAddBlock('"+w.id+"')","alt")} <label>Post-workout evaluation</label><div class="row"><select onchange="devSetPostEval('${w.id}','effort',this.value)">${["","Low","Medium","High"].map(v=>`<option value="${v}" ${v===((w.postEval&&w.postEval.effort)||"")?"selected":""}>${v||"Effort —"}</option>`).join("")}</select><select onchange="devSetPostEval('${w.id}','rating',this.value)">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${n===((w.postEval&&w.postEval.rating)||0)?"selected":""}>${n||"Rating —"}</option>`).join("")}</select></div>${area("Post-workout notes",w.postEval?w.postEval.notes:"","devSetPostEval('"+w.id+"','notes',this.value)")}<div class="row">${w.status!=="done"?btn("Mark workout complete","devCompleteWorkout('"+w.id+"')","gold"):"<b>Completed</b>"} ${btn("Delete workout","devDeleteWorkout('"+w.id+"')","danger")}</div></details>`;
}

function go(t){tab=t;render()}function render(){document.getElementById('nav').innerHTML=tabs.map(t=>btn(t,`go('${t}')`,tab===t?'active':'')).join('');let a=p(),h='';const head=`<div class="card"><div class="row"><div class="grow"><span class="muted">ACTIVE TEAM / PRACTICE</span><h2>${esc(team().name)}</h2></div><select onchange="switchTeam(this.value)">${s.teams.map(t=>`<option value="${t.id}" ${t.id===s.team?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><select class="wide" onchange="switchPlan(this.value)">${s.plans.filter(x=>x.team===s.team).map(x=>`<option value="${x.id}" ${x.id===s.active?'selected':''}>${esc(x.date+' · '+x.name)}</option>`).join('')}</select></div>`;
if(tab==='Live'){let d=a.drills[a.index],total=a.drills.reduce((n,x)=>n+x.min,0),done=a.drills.filter(x=>x.done).reduce((n,x)=>n+x.min,0),times=planTimes(a);h=head+`<div class="card"><span class="muted">CURRENT DRILL</span><h2>${esc(d?.name||'Practice complete')}</h2><div id="clock" class="clock">00:00</div><div class="row">${btn('Start / Resume','start()','gold')}${btn('Pause','pause()')}${btn('+1 min','extend()','alt')}${btn('Reset','resetTimer()','alt')}${btn('Complete & next','next(true)')}${btn('Skip','next(false)','alt')}<button class="danger" id="stopAlarm" onclick="alarmStop()" style="display:none">Stop alarm</button></div><div class="row" style="margin-top:8px"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" ${autoAdvanceOn?'checked':''} onchange="setAuto(this.checked)"> Auto-advance</label><span class="muted">When on, each drill starts the next one automatically after the alarm.</span></div><p>${esc(d?.notes||'Review and save your session.')}</p><progress max="${total||1}" value="${done}"></progress><p class="muted">${done} / ${total} planned minutes completed</p></div><div class="card"><h2>Practice timeline</h2>${a.drills.map((x,i)=>`<div class="drill ${x.done?'done':''} ${i===a.index?'current':''}"><div class="row"><input type="checkbox" ${x.done?'checked':''} onchange="mark(${i},this.checked)"><div class="grow"><b>${esc(x.name)}</b><div class="muted">${times[i]} · ${x.min} min</div>${(x.links||[]).map(l=>`<a class="watch" href="${esc(l.url)}" target="_blank" rel="noopener">▶ Watch: ${esc(l.label||'Live example')}</a>`).join('')}</div>${btn('Open',`jump(${i})`,'alt')}</div></div>`).join('')}${area('Live coaching notes',a.notes,"update('notes',this.value)")}${btn('Save session to history','archive()','gold')}</div>`}
if(tab==='Planner'){h=head+`<div class="card"><div class="row">${btn('New practice','newPlan()','gold')}${btn('Duplicate practice','duplicate()','alt')}</div>${field('Practice title',a.name,"update('name',this.value)")}${field('Date',a.date,"update('date',this.value)",'date')}${field('Practice start time',a.startTime||'17:30',"update('startTime',this.value)",'time')}${field('Location',a.location,"update('location',this.value)")}${field('Coach',a.coach,"update('coach',this.value)")}${area('Objectives',a.focus,"update('focus',this.value)")}<p><b>${a.drills.reduce((n,x)=>n+x.min,0)} planned minutes</b></p></div><div class="card"><h2>Edit drills</h2>${a.drills.map((d,i)=>`<div class="drill">${field('Drill '+(i+1),d.name,`editDrill(${i},'name',this.value)`)}${field('Minutes',d.min,`editDrill(${i},'min',this.value)`,'number')}${area('Setup / cues / success standard',d.notes,`editDrill(${i},'notes',this.value)`)}${(d.links||[]).map((l,j)=>`${field('Link '+(j+1)+' label',l.label,`editLink(${i},${j},'label',this.value)`)}${field('Link '+(j+1)+' URL',l.url,`editLink(${i},${j},'url',this.value)`,'url')}${btn('Remove link',`removeLink(${i},${j})`,'danger')}`).join('')}${btn('Add live example link',`addLink(${i})`,'alt')}<div class="row">${btn('↑',`move(${i},-1)`,'alt')}${btn('↓',`move(${i},1)`,'alt')}${btn('Remove',`removeDrill(${i})`,'danger')}</div></div>`).join('')}${btn('Add blank drill','addDrill()','gold')} ${btn('Add from library',"go('Library')",'alt')}</div>`}

let alarmOn=false,alarmTimer=null,audioCtx=null,wakeLock=null,keepOsc=null,keepGain=null,autoAdvanceTimer=null,autoPaused=false;
let autoAdvanceOn=false;try{autoAdvanceOn=localStorage.getItem('dvh-os-auto')==='1'}catch(e){}
function ensureAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function startKeepAlive(){try{ensureAudio();if(!audioCtx||keepOsc)return;keepGain=audioCtx.createGain();keepGain.gain.value=0;keepOsc=audioCtx.createOscillator();keepOsc.frequency.value=440;keepOsc.connect(keepGain);keepGain.connect(audioCtx.destination);keepOsc.start()}catch(e){}}
function stopKeepAlive(){try{if(keepOsc){keepOsc.stop();keepOsc.disconnect();keepOsc=null}}catch(e){}try{if(keepGain){keepGain.disconnect();keepGain=null}}catch(e){}}
async function beepCycle(){try{if(navigator.vibrate)navigator.vibrate([300,100,300,100,300])}catch(e){}try{ensureAudio()}catch(e){}if(!audioCtx)return;try{await Promise.race([audioCtx.resume(),new Promise(r=>setTimeout(r,500))])}catch(e){}if(audioCtx.state==='suspended'){try{await Promise.race([audioCtx.resume(),new Promise(r=>setTimeout(r,500))])}catch(e){}}try{let t0=audioCtx.currentTime;for(let i=0;i<3;i++){let s=t0+i*0.5,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=880;g.gain.setValueAtTime(0.0001,s);g.gain.linearRampToValueAtTime(0.5,s+0.02);g.gain.setValueAtTime(0.5,s+0.27);g.gain.linearRampToValueAtTime(0.0001,s+0.3);o.connect(g);g.connect(audioCtx.destination);o.start(s);o.stop(s+0.32)}}catch(e){}}
function showAlarmOverlay(){try{let ov=document.getElementById('alarmOverlay');if(!ov)return;let d=p().drills[p().index];let nm=document.getElementById('alarmDrill');if(nm)nm.textContent=d?d.name:'';let st=document.getElementById('alarmStatus');let pb=document.getElementById('alarmPause');let rb=document.getElementById('alarmResume');let last=p().index>=p().drills.length-1;if(st){if(autoPaused){st.textContent=last?'Paused on the last drill — tap Resume to finish the practice.':'Paused — tap Resume to continue to the next drill.';st.style.display=''}else if(autoAdvanceTimer){st.textContent=last?'Last drill — practice ends shortly. Tap Stop alarm to finish now.':'Next drill starting shortly — tap Stop alarm to go now.';st.style.display=''}else{st.textContent='';st.style.display='none'}}if(pb)pb.style.display=autoAdvanceTimer&&!autoPaused?'':'none';if(rb)rb.style.display=autoPaused?'':'none';ov.style.display='flex'}catch(e){}}
function hideAlarmOverlay(){try{let ov=document.getElementById('alarmOverlay');if(ov)ov.style.display='none'}catch(e){}}
function cancelAutoAdvance(){try{if(autoAdvanceTimer){clearTimeout(autoAdvanceTimer);autoAdvanceTimer=null}}catch(e){}}
function scheduleAutoAdvance(){try{cancelAutoAdvance();autoAdvanceTimer=setTimeout(()=>{autoAdvanceTimer=null;if(!autoPaused)autoAdvance()},5000)}catch(e){}}
function autoAdvance(){try{cancelAutoAdvance();autoPaused=false;let a=p();let isLast=a.index>=a.drills.length-1;stopAlarm();next(true);if(!isLast)start()}catch(e){}}
function alarmStop(){try{if(alarmOn&&autoAdvanceOn){autoPaused=false;autoAdvance();return}}catch(e){}stopAlarm()}
function pauseAuto(){try{if(!alarmOn)return;cancelAutoAdvance();autoPaused=true;if(alarmTimer){clearInterval(alarmTimer);alarmTimer=null}showAlarmOverlay()}catch(e){}}
function resumeAuto(){try{if(!autoPaused)return;autoPaused=false;autoAdvance()}catch(e){}}
function setAuto(v){try{autoAdvanceOn=!!v;try{localStorage.setItem('dvh-os-auto',autoAdvanceOn?'1':'0')}catch(e){}if(!autoAdvanceOn){cancelAutoAdvance();autoPaused=false}if(alarmOn)showAlarmOverlay()}catch(e){}}
function startAlarm(){if(alarmOn)return;alarmOn=true;try{ensureAudio()}catch(e){}if(autoAdvanceOn)scheduleAutoAdvance();showAlarmOverlay();beepCycle();alarmTimer=setInterval(beepCycle,3000)}
function stopAlarm(){cancelAutoAdvance();autoPaused=false;if(!alarmOn&&!alarmTimer)return;alarmOn=false;if(alarmTimer){clearInterval(alarmTimer);alarmTimer=null}hideAlarmOverlay();if(!p().timer.end)stopKeepAlive();let el=document.getElementById('clock');if(el)el.classList.remove('alarming');let sb=document.getElementById('stopAlarm');if(sb)sb.style.display='none'}
async function requestWakeLock(){try{if('wakeLock' in navigator&&!wakeLock)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWakeLock(){try{if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}
function tick(){let el=document.getElementById('clock');if(!el)return;let t=p().timer,r=t.end?Math.max(0,Math.ceil((t.end-Date.now())/1000)):t.remaining;if(t.end&&r===0){t.end=null;t.remaining=0;save();releaseWakeLock();startAlarm()}el.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');if(alarmOn)el.classList.add('alarming');let sb=document.getElementById('stopAlarm');if(sb)sb.style.display=alarmOn?'':'none';if(alarmOn)showAlarmOverlay();else hideAlarmOverlay()}
function start(){let t=p().timer;if(!t.end&&t.remaining>0){ensureAudio();stopAlarm();t.end=Date.now()+t.remaining*1000;save();tick();requestWakeLock();startKeepAlive()}}function pause(){stopAlarm();stopKeepAlive();releaseWakeLock();let t=p().timer;if(t.end){t.remaining=Math.max(0,Math.ceil((t.end-Date.now())/1000));t.end=null;save();tick()}}function extend(){stopAlarm();let t=p().timer;if(t.end)t.end+=60000;else t.remaining+=60;save();tick()}function resetTimer(){stopAlarm();stopKeepAlive();releaseWakeLock();p().timer={remaining:(p().drills[p().index]?.min||0)*60,end:null};save();tick()}function jump(i){p().index=i;resetTimer();save();render()}function next(done){let a=p();if(a.drills[a.index]&&done)a.drills[a.index].done=true;jump(Math.min(a.index+1,a.drills.length))}function mark(i,v){p().drills[i].done=v;save();render()}
function blank(t){return {id:uid(),team:t,name:'New practice',date:new Date().toISOString().slice(0,10),startTime:'17:30',location:'',coach:'',focus:'',drills:[],notes:'',attendance:{},ratings:{},teamEval:{},score:[0,0],index:0,timer:{remaining:0,end:null}}}function newPlan(){cancelAutoAdvance();autoPaused=false;let a=blank(s.team);s.plans.push(a);s.active=a.id;save();render()}function switchTeam(id){cancelAutoAdvance();autoPaused=false;s.team=id;let a=s.plans.find(x=>x.team===id);if(!a){a=blank(id);s.plans.push(a)}s.active=a.id;save();render()}function switchPlan(id){cancelAutoAdvance();autoPaused=false;s.active=id;save();render()}function clonePlan(x){cancelAutoAdvance();autoPaused=false;let a=JSON.parse(JSON.stringify(x));Object.assign(a,{id:uid(),date:new Date().toISOString().slice(0,10),notes:'',attendance:{},ratings:{},score:[0,0],index:0});a.teamEval={};a.drills.forEach(d=>d.done=false);a.timer={remaining:(a.drills[0]?.min||0)*60,end:null};s.plans.push(a);s.team=a.team;s.active=a.id;save();go('Planner')}function duplicate(){clonePlan(p())}function editDrill(i,k,v){p().drills[i][k]=k==='min'?Math.max(0,Math.round(Number(v)||0)):v;if(k==='min'){resetTimer();save();render()}else save()}
function editLink(i,j,k,v){let d=p().drills[i];if(!d||!Array.isArray(d.links)||!d.links[j])return;d.links[j][k]=v;save()}
function addLink(i){let d=p().drills[i];if(!d)return;if(!Array.isArray(d.links))d.links=[];d.links.push({label:'',url:''});save();render()}
function removeLink(i,j){let d=p().drills[i];if(!d||!Array.isArray(d.links))return;d.links.splice(j,1);save();render()}function move(i,n){let d=p().drills,j=i+n;if(j<0||j>=d.length)return;[d[i],d[j]]=[d[j],d[i]];jump(0)}function removeDrill(i){p().drills.splice(i,1);jump(0)}function addDrill(){p().drills.push(makeDrill(['New drill',5,'']));if(p().drills.length===1)resetTimer();save();render()}function newLibrary(){s.library.push(makeDrill(['New drill',5,'']));save();render()}function libEdit(i,k,v){s.library[i][k]=k==='min'?Math.max(0,Math.round(Number(v)||0)):v;save()}function useLib(i){let d=s.library[i];p().drills.push(makeDrill([d.name,d.min,d.notes]));if(p().drills.length===1)resetTimer();save();go('Planner')}function delLib(i){if(confirm('Delete library drill?')){s.library.splice(i,1);save();render()}}function addTeam(){let n=document.getElementById('teamName').value.trim();if(n){let id=uid();s.teams.push({id,name:n,players:[]});switchTeam(id)}}function addPlayer(){let n=document.getElementById('playerName').value.trim();if(n){team().players.push({id:uid(),name:n});save();render()}}function removePlayer(id){if(confirm('Remove player from roster? Saved history remains.')){team().players=team().players.filter(x=>x.id!==id);save();render()}}function att(id,v){p().attendance[id]=v;save()}function rate(id,c,v){p().ratings[id]??={};p().ratings[id][c]=c==='notes'?v:Number(v);save();let el=document.getElementById('pa-'+id);if(el)el.textContent=practiceAvgText(p(),id)}function score(i,v){p().score[i]=Math.max(0,p().score[i]+v);save();render()}function resetScore(){p().score=[0,0];save();render()}function archive(){pause();let a=JSON.parse(JSON.stringify(p()));a.archiveId=uid();a.teamName=team().name;a.savedAt=new Date().toISOString();s.history.push(a);save();go('History')}function fromHistory(id){clonePlan(s.history.find(x=>x.archiveId===id))}function exportData(){let u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='DVH-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.teams)||!Array.isArray(x.plans)||!Array.isArray(x.library)||!Array.isArray(x.history)||!x.teams.some(t=>t.id===x.team)||!x.plans.some(p=>p.id===x.active))throw Error();if(confirm('Replace all local records with this backup?')){cancelAutoAdvance();autoPaused=false;s=x;normGames();normPlans();normPlayers();normDev();s.plans.forEach(pl=>{if(!pl.teamEval||typeof pl.teamEval!=='object')pl.teamEval={}});s.history.forEach(pl=>{if(!pl.teamEval||typeof pl.teamEval!=='object')pl.teamEval={}});save();go('Live')}}catch(e){alert('Invalid DVH backup.')}}document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(p().timer.end)requestWakeLock();if(alarmOn){try{ensureAudio()}catch(e){}beepCycle()}});save();render();setInterval(()=>{tick();gameTick();devTick()},250);
</script><script>
const statusEl=document.getElementById('offlineStatus');
function statusUpdate(){statusEl.textContent=(navigator.onLine?'Online':'Offline')+' · '+(navigator.serviceWorker?.controller?'Offline cache active':'Offline setup pending')+' · Records stored on this device';}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(statusUpdate).catch(()=>{statusEl.textContent='Offline setup failed. Open the hosted HTTPS site and reload.'});navigator.serviceWorker.addEventListener('controllerchange',statusUpdate);window.addEventListener('online',statusUpdate);window.addEventListener('offline',statusUpdate);}else{statusEl.textContent='Offline installation requires a supported browser and HTTPS.';}
</script></body></html>
